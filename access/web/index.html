<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>LabCentral console</title><style>html,body,#screen{height:100%;margin:0;background:#17151d;color:#eee;font:16px system-ui}#status{position:absolute;top:0;padding:8px;background:#272330;z-index:1}</style><div id="status" role="status">Connecting…</div><div id="screen"></div><script type="module">import RFB from './vendor/core/rfb.js';const status=document.querySelector('#status');const rfb=new RFB(document.querySelector('#screen'),`ws://${location.host}/websocket`);rfb.scaleViewport=true;rfb.resizeSession=true;rfb.addEventListener('connect',()=>status.hidden=true);rfb.addEventListener('disconnect',()=>{status.hidden=false;status.textContent='Console disconnected. Close this tab and request a new session.'});rfb.addEventListener('credentialsrequired',async()=>{try{const r=await fetch('/credentials');if(!r.ok)throw Error();rfb.sendCredentials(await r.json())}catch{status.textContent='Console authentication failed. Request a new session.'}});</script></html>
