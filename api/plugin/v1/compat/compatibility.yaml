formatVersion: 1
wireProtocol: labcentral.plugin/v1
selectionRule: highest common major, then highest common minor; configured host minimums are already removed from host ranges
descriptorBaseline:
  path: api/plugin/v1/compat/plugin-v1-descriptor.binpb.b64
  encoding: base64
  sha256: 7ced3c0b4a1df19d9c7919306b61b7ce3c8e8b6f9ad46d8ee4bc30f3f53f66d5
  buildFlags: [--exclude-source-info, --as-file-descriptor-set]
  breakingCategory: FILE
currentDescriptor:
  protocol: {major: 1, minor: 2}
  sha256: c07911da241c20a6c3f2518c644d3f03fc3374aa37c30329bff9681e654b2d88
cases:
  - id: TEST-PLUGIN-NEGOTIATE-001
    kind: negotiate
    hostRanges: [{major: 1, minMinor: 0, maxMinor: 3}]
    pluginRanges: [{major: 1, minMinor: 0, maxMinor: 1}]
    expected: {selected: {major: 1, minor: 1}}
  - id: TEST-PLUGIN-NEGOTIATE-002
    kind: negotiate
    hostRanges:
      - {major: 1, minMinor: 0, maxMinor: 3}
      - {major: 2, minMinor: 0, maxMinor: 1}
    pluginRanges:
      - {major: 1, minMinor: 1, maxMinor: 5}
      - {major: 2, minMinor: 0, maxMinor: 0}
    expected: {selected: {major: 2, minor: 0}}
  - id: TEST-PLUGIN-NEGOTIATE-003
    kind: negotiate
    hostRanges: [{major: 2, minMinor: 0, maxMinor: 2}]
    pluginRanges: [{major: 1, minMinor: 0, maxMinor: 9}]
    expected: {error: protocol_incompatible}
  - id: TEST-PLUGIN-NEGOTIATE-004
    kind: negotiate
    hostRanges: [{major: 1, minMinor: 3, maxMinor: 5}]
    pluginRanges: [{major: 1, minMinor: 0, maxMinor: 2}]
    expected: {error: protocol_incompatible}
  - id: TEST-PLUGIN-NEGOTIATE-005
    kind: negotiate
    hostRanges: [{major: 1, minMinor: 0, maxMinor: 1}]
    pluginRanges: [{major: 1, minMinor: 0, maxMinor: 1}]
    expected: {selected: {major: 1, minor: 1}}
  - id: TEST-PLUGIN-FEATURE-001
    kind: feature
    selectedProtocol: {major: 1, minor: 1}
    requiredMinor: 1
    pluginFeatures: [opaque-allocation-claims-v1, dependency-resource-input-v1]
    requiredFeatures: [opaque-allocation-claims-v1, dependency-resource-input-v1]
    expected: {result: accepted}
  - id: TEST-PLUGIN-FEATURE-002
    kind: feature
    selectedProtocol: {major: 1, minor: 0}
    requiredMinor: 1
    pluginFeatures: [opaque-allocation-claims-v1, dependency-resource-input-v1]
    requiredFeatures: [opaque-allocation-claims-v1, dependency-resource-input-v1]
    expected: {error: protocol_feature_unavailable}
  - id: TEST-PLUGIN-ACCESS-NEGOTIATE-001
    kind: negotiate
    category: access
    hostRanges: [{major: 1, minMinor: 2, maxMinor: 2}]
    pluginRanges: [{major: 1, minMinor: 2, maxMinor: 2}]
    requiredFeatures: [access-authorization-recheck-v1]
    expected: {selected: {major: 1, minor: 2}}
  - id: TEST-PLUGIN-ACCESS-NEGOTIATE-002
    kind: negotiate
    category: access
    hostRanges: [{major: 1, minMinor: 2, maxMinor: 2}]
    pluginRanges: [{major: 1, minMinor: 0, maxMinor: 1}]
    expected: {error: protocol_incompatible}
  - id: TEST-PLUGIN-IDENTITY-001
    kind: identity
    configuredPluginID: io.labcentral.provider.fake
    reportedPluginID: dev.example.provider.fake
    launchTokenState: valid
    expected: {error: plugin_identity_mismatch}
  - id: TEST-PLUGIN-TOKEN-001
    kind: identity
    configuredPluginID: io.labcentral.provider.fake
    reportedPluginID: io.labcentral.provider.fake
    launchTokenState: consumed
    expected: {error: launch_token_invalid}
  - id: TEST-PLUGIN-DEADLINE-001
    kind: deadline
    deadline: missing
    mutationDispatched: false
    expected: {error: invocation_deadline_required}
  - id: TEST-PLUGIN-DEADLINE-002
    kind: deadline
    deadline: expired
    mutationDispatched: false
    expected: {error: invocation_deadline_expired}
  - id: TEST-PLUGIN-DEADLINE-003
    kind: deadline
    deadline: expires_after_dispatch
    mutationDispatched: true
    responseReceived: false
    expected: {operationState: unknown, nextAction: get_invocation_before_retry}
  - id: TEST-PLUGIN-CANCEL-001
    kind: cancellation
    invocationState: before_unsafe_boundary
    expected: {rpcOutcome: OUTCOME_REQUESTED, operationState: canceled}
  - id: TEST-PLUGIN-CANCEL-002
    kind: cancellation
    invocationState: side_effect_committed
    expected: {rpcOutcome: OUTCOME_TOO_LATE, operationState: running}
  - id: TEST-PLUGIN-STATE-001
    kind: providerState
    storedMajor: 1
    readableMajors: [1]
    expected: {result: readable}
  - id: TEST-PLUGIN-STATE-002
    kind: providerState
    storedMajor: 2
    readableMajors: [1]
    expected: {error: state_version_incompatible}
