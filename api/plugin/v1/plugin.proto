syntax = "proto3";

package labcentral.plugin.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/labcentral/labcentral/api/plugin/v1;pluginv1";

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

message ProtocolVersionRange {
  uint32 major = 1;
  uint32 min_minor = 2;
  uint32 max_minor = 3;
}

message SchemaVersion {
  string name = 1;
  uint32 major = 2;
  uint32 minor = 3;
}

message PluginInfo {
  string plugin_id = 1;
  string plugin_version = 2;
  string build_digest = 3;
  repeated ProtocolVersionRange supported_protocols = 4;
  repeated string categories = 5;
  repeated string provider_kinds = 6;
  repeated string access_kinds = 7;
  repeated SchemaVersion schemas = 8;
  repeated string features = 9;
  repeated ProtocolVersionRange supported_provider_protocols = 10;
  repeated ProtocolVersionRange supported_access_protocols = 11;
  repeated string supported_access_methods = 12;
  repeated SchemaVersion accepted_access_endpoint_schemas = 13;
  repeated ProtocolVersionRange supported_source_protocols = 14;
  repeated ProtocolVersionRange supported_builder_protocols = 15;
  repeated string source_kinds = 16;
  repeated string builder_kinds = 17;
  repeated AccessDescriptor access_descriptors = 18;
}

message RegisterPluginRequest {
  string launch_token = 1;
  string configured_plugin_id = 2;
  string plugin_instance_id = 3;
  string service_endpoint = 4;
  PluginInfo plugin = 5;
}

message RegisterPluginResponse {
  ProtocolVersion selected_protocol = 1;
  google.protobuf.Duration heartbeat_interval = 2;
  uint64 max_request_bytes = 3;
  uint64 max_response_bytes = 4;
  ProtocolVersion selected_provider_protocol = 5;
  ProtocolVersion selected_access_protocol = 6;
  string access_callback_credential = 7;
  string access_audience = 8;
  ProtocolVersion selected_source_protocol = 9;
  ProtocolVersion selected_builder_protocol = 10;
}

message HeartbeatRequest {
  string plugin_instance_id = 1;
  uint64 sequence = 2;
  google.protobuf.Timestamp sent_at = 3;
}

message HeartbeatResponse {
  google.protobuf.Timestamp received_at = 1;
  bool drain_requested = 2;
}

message HealthRequest {}

message HealthResponse {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_STARTING = 1;
    STATUS_HEALTHY = 2;
    STATUS_DEGRADED = 3;
    STATUS_UNHEALTHY = 4;
  }

  Status status = 1;
  string safe_message = 2;
}

message StringList {
  repeated string values = 1;
}

message IntList {
  repeated int64 values = 1;
}

message Parameter {
  string name = 1;
  oneof value {
    bool bool_value = 2;
    int64 int_value = 3;
    double number_value = 4;
    string string_value = 5;
    StringList string_list = 6;
    IntList int_list = 7;
  }
}

message Capability {
  enum Support {
    SUPPORT_UNSPECIFIED = 0;
    SUPPORT_NATIVE = 1;
    SUPPORT_EMULATED = 2;
    SUPPORT_CONSTRAINED = 3;
    SUPPORT_UNSUPPORTED = 4;
  }

  string feature_id = 1;
  Support support = 2;
  repeated Parameter parameters = 3;
  repeated string constraints = 4;
  string optional_component = 5;
  string evidence = 6;
}

message TargetContext {
  string target_id = 1;
  bytes config_envelope = 2;
  bytes credential_envelope = 3;
  string config_fingerprint = 4;
}

message DiscoverTargetRequest {
  TargetContext target = 1;
}

message DiscoverTargetResponse {
  repeated Capability capabilities = 1;
  google.protobuf.Timestamp discovered_at = 2;
  google.protobuf.Timestamp valid_until = 3;
  bytes override_json_schema = 4;
  string override_schema_digest = 5;
  bytes capacity_json = 6;
}

message CallContext {
  string request_id = 1;
  string operation_id = 2;
  string invocation_id = 3;
  string lab_instance_id = 4;
  string logical_resource_id = 5;
  string provider_target_id = 6;
  string idempotency_key = 7;
  uint64 desired_generation = 8;
  uint64 fencing_token = 9;
  string traceparent = 10;
}

message ProviderState {
  SchemaVersion schema = 1;
  string plugin_id = 2;
  string plugin_version = 3;
  bytes opaque = 4;
  repeated string ownership_ids = 5;
  bytes digest = 6;
}

message AllocationClaim {
  string namespace = 1;
  string value = 2;
}

message ResourceDependency {
  string logical_resource_id = 1;
  bytes provider_plan = 2;
  string provider_plan_digest = 3;
  ProviderState provider_state = 4;
  bytes observed_state_json = 5;
  repeated AllocationClaim committed_allocations = 6;
}

message StructuredError {
  string code = 1;
  string error_class = 2;
  string safe_message = 3;
  bool retryable = 4;
  google.protobuf.Duration retry_after = 5;
  string field_path = 6;
  string resource_ref = 7;
  repeated StructuredError causes = 8;
}

message Warning {
  string code = 1;
  string safe_message = 2;
  string resource_ref = 3;
}

message ValidateLabRequest {
  CallContext context = 1;
  TargetContext target = 2;
  bytes canonical_lab_json = 3;
  bytes provider_override_json = 4;
}

message ValidateLabResponse {
  repeated StructuredError errors = 1;
  repeated Warning warnings = 2;
  bytes provider_plan = 3;
  string provider_plan_digest = 4;
}

message ResourceMutationInput {
  CallContext context = 1;
  TargetContext target = 2;
  bytes canonical_resource_json = 3;
  bytes provider_plan = 4;
  ProviderState prior_state = 5;
  repeated string ownership_tokens = 6;
  repeated ResourceDependency dependencies = 7;
  repeated AllocationClaim committed_allocations = 8;
}

message Progress {
  string phase = 1;
  optional double percent = 2;
  string safe_message = 3;
  string provider_task_ref = 4;
  google.protobuf.Timestamp occurred_at = 5;
}

// Optional point-in-time measurements. Absence means unavailable, never zero.
// CPU fraction is normalized to the VM's configured vCPU capacity.
message ResourceUsage {
  google.protobuf.Timestamp sampled_at = 1;
  optional double cpu_fraction = 2;
  optional uint32 virtual_cpus = 3;
  optional uint64 memory_used_bytes = 4;
  optional uint64 memory_capacity_bytes = 5;
}

message ResourceResult {
  ProviderState provider_state = 1;
  bytes observed_state_json = 2;
  repeated Warning warnings = 3;
  StructuredError error = 4;
  bool compensation_attempted = 5;
  bool compensation_complete = 6;
  ResourceUsage usage = 7;
}

message InvocationEvent {
  oneof event {
    Progress progress = 1;
    ResourceResult result = 2;
  }
}

message PlanResourceRequest {
  ResourceMutationInput input = 1;
  repeated AllocationClaim excluded_allocations = 2;
}

message PlanResourceResponse {
  bytes provider_plan = 1;
  string provider_plan_digest = 2;
  repeated Warning warnings = 3;
  StructuredError error = 4;
  repeated AllocationClaim proposed_allocations = 5;
}

message ApplyResourceRequest {
  ResourceMutationInput input = 1;
}

message ApplyResourceResponse {
  InvocationEvent event = 1;
}

message ReadResourceRequest {
  ResourceMutationInput input = 1;
}

message ReadResourceResponse {
  ResourceResult result = 1;
}

message DestroyResourceRequest {
  ResourceMutationInput input = 1;
}

message DestroyResourceResponse {
  InvocationEvent event = 1;
}

enum LifecycleAction {
  LIFECYCLE_ACTION_UNSPECIFIED = 0;
  LIFECYCLE_ACTION_START = 1;
  LIFECYCLE_ACTION_STOP = 2;
  LIFECYCLE_ACTION_PAUSE = 3;
  LIFECYCLE_ACTION_RESUME = 4;
  LIFECYCLE_ACTION_SNAPSHOT = 5;
  LIFECYCLE_ACTION_RESTORE = 6;
  LIFECYCLE_ACTION_CLONE = 7;
  LIFECYCLE_ACTION_RESET = 8;
}

message LifecycleRequest {
  CallContext context = 1;
  TargetContext target = 2;
  LifecycleAction action = 3;
  ProviderState prior_state = 4;
  bytes action_parameters_json = 5;
}

message LifecycleResponse {
  InvocationEvent event = 1;
}

message GetInvocationRequest {
  CallContext context = 1;
  TargetContext target = 2;
  string invocation_id = 3;
}

message GetInvocationResponse {
  ResourceResult result = 1;
}

message CancelInvocationRequest {
  CallContext context = 1;
  TargetContext target = 2;
  string invocation_id = 3;
}

message CancelInvocationResponse {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    OUTCOME_REQUESTED = 1;
    OUTCOME_TOO_LATE = 2;
    OUTCOME_NOT_FOUND = 3;
  }

  Outcome outcome = 1;
}

message MigrateStateRequest {
  CallContext context = 1;
  TargetContext target = 2;
  ProviderState state = 3;
  SchemaVersion destination = 4;
  bool dry_run = 5;
}

message MigrateStateResponse {
  ProviderState state = 1;
  repeated Warning warnings = 2;
  StructuredError error = 3;
  bool irreversible = 4;
}

message DiscoverAccessEndpointRequest {
  CallContext context = 1;
  TargetContext target = 2;
  ProviderState resource_state = 3;
  string method = 4;
}

message DiscoverAccessEndpointResponse {
  bytes opaque_connection_data = 1;
  google.protobuf.Timestamp valid_until = 2;
  repeated Warning warnings = 3;
  StructuredError error = 4;
  SchemaVersion endpoint_schema = 5;
  string endpoint_digest = 6;
  string target_id = 7;
  string lab_instance_id = 8;
  string logical_resource_id = 9;
  string method = 10;
  string provider_state_digest = 11;
}

message ListImagesRequest {
  CallContext context = 1;
  TargetContext target = 2;
  string page_token = 3;
  uint32 page_size = 4;
}

message ImageRecord {
  string provider_image_id = 1;
  string display_name = 2;
  string architecture = 3;
  string digest = 4;
  repeated string labels = 5;
}

message ListImagesResponse {
  repeated ImageRecord images = 1;
  string next_page_token = 2;
}

message ImportImageRequest {
  CallContext context = 1;
  TargetContext target = 2;
  string artifact_digest = 3;
  string source_provenance_digest = 4;
  bytes import_parameters_json = 5;
}

message ImportImageResponse {
  InvocationEvent event = 1;
}

message CreateAccessRequest {
  CallContext context = 1;
  string access_session_id = 2;
  string subject_id = 3;
  string method = 4;
  google.protobuf.Timestamp expires_at = 5;
  bytes opaque_connection_data = 6;
  SchemaVersion endpoint_schema = 7;
  string endpoint_digest = 8;
  string provider_state_digest = 9;
  string audience = 10;
}

message CreateAccessResponse {
  bytes opaque_access_state = 1;
  string launch_url = 2;
  string one_time_token = 3;
  google.protobuf.Timestamp valid_until = 4;
  StructuredError error = 5;
  SchemaVersion access_state_schema = 6;
  string access_state_digest = 7;
}

message RevokeAccessRequest {
  CallContext context = 1;
  string access_session_id = 2;
  bytes opaque_access_state = 3;
}

message RevokeAccessResponse {
  bool active_connections_closed = 1;
  StructuredError error = 2;
}

message ExchangeAccessTokenRequest {
  string callback_credential = 1;
  string access_session_id = 2;
  string audience = 3;
  string one_time_token = 4;
}

message ExchangeAccessTokenResponse {
  string authorization_lease = 1;
  google.protobuf.Timestamp valid_until = 2;
  google.protobuf.Duration recheck_after = 3;
  StructuredError error = 4;
}

message RecheckAccessLeaseRequest {
  string callback_credential = 1;
  string access_session_id = 2;
  string audience = 3;
  string authorization_lease = 4;
}

message RecheckAccessLeaseResponse {
  string authorization_lease = 1;
  google.protobuf.Timestamp valid_until = 2;
  google.protobuf.Duration recheck_after = 3;
  StructuredError error = 4;
}

message EndAccessLeaseRequest {
  string callback_credential = 1;
  string access_session_id = 2;
  string audience = 3;
  string authorization_lease = 4;
  string reason = 5;
}

message EndAccessLeaseResponse {
  bool ended = 1;
  StructuredError error = 2;
}

service PluginRegistrationService {
  rpc RegisterPlugin(RegisterPluginRequest) returns (RegisterPluginResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

service PluginRuntimeService {
  rpc Health(HealthRequest) returns (HealthResponse);
}

service ProviderService {
  rpc DiscoverTarget(DiscoverTargetRequest) returns (DiscoverTargetResponse);
  rpc ValidateLab(ValidateLabRequest) returns (ValidateLabResponse);
  rpc PlanResource(PlanResourceRequest) returns (PlanResourceResponse);
  rpc ApplyResource(ApplyResourceRequest) returns (stream ApplyResourceResponse);
  rpc ReadResource(ReadResourceRequest) returns (ReadResourceResponse);
  rpc DestroyResource(DestroyResourceRequest) returns (stream DestroyResourceResponse);
  rpc Lifecycle(LifecycleRequest) returns (stream LifecycleResponse);
  rpc GetInvocation(GetInvocationRequest) returns (GetInvocationResponse);
  rpc CancelInvocation(CancelInvocationRequest) returns (CancelInvocationResponse);
  rpc MigrateState(MigrateStateRequest) returns (MigrateStateResponse);
  rpc DiscoverAccessEndpoint(DiscoverAccessEndpointRequest) returns (DiscoverAccessEndpointResponse);
  rpc ListImages(ListImagesRequest) returns (ListImagesResponse);
  rpc ImportImage(ImportImageRequest) returns (stream ImportImageResponse);
}

service AccessService {
  rpc DownloadAccess(DownloadAccessRequest) returns (DownloadAccessResponse);
  rpc InspectAccess(InspectAccessRequest) returns (InspectAccessResponse);
  rpc CreateAccess(CreateAccessRequest) returns (CreateAccessResponse);
  rpc RevokeAccess(RevokeAccessRequest) returns (RevokeAccessResponse);
}

service AccessAuthorizationService {
  rpc ExchangeAccessToken(ExchangeAccessTokenRequest) returns (ExchangeAccessTokenResponse);
  rpc RecheckAccessLease(RecheckAccessLeaseRequest) returns (RecheckAccessLeaseResponse);
  rpc EndAccessLease(EndAccessLeaseRequest) returns (EndAccessLeaseResponse);
}

// Presentation and enforcement are core-known semantics, not plugin-defined policy.
message AccessDescriptor {
  string method = 1;
  string title = 2;
  repeated string target_kinds = 3;
  string presentation = 4;
  repeated SchemaVersion endpoint_schemas = 5;
  uint32 maximum_offline_seconds = 6;
  string renderer = 7;
}

message DownloadAccessRequest {
  CallContext context = 1;
  string access_session_id = 2;
  bytes opaque_access_state = 3;
  string delivery_id = 4;
  string one_time_token = 5;
}
message DownloadAccessResponse {
  bytes content = 1;
  string media_type = 2;
  string filename = 3;
  StructuredError error = 4;
}
message InspectAccessRequest {
  CallContext context = 1;
  string access_session_id = 2;
  bytes opaque_access_state = 3;
}
message InspectAccessResponse {
  string state = 1;
  google.protobuf.Timestamp enforced_until = 2;
  bool active_connections_closed = 3;
  StructuredError error = 4;
}

message ArtifactHandle {
  string digest = 1;
  uint64 size = 2;
  string media_type = 3;
  string transfer_token = 4;
}
message ExtensionConfiguration {
  SchemaVersion schema = 1;
  bytes canonical_json = 2;
}
message SourceServiceResolveRequest {
  CallContext context = 1;
  string binding_id = 2;
  string reference = 3;
  ExtensionConfiguration configuration = 4;
  bytes credential_envelope = 5;
  ArtifactHandle output = 6;
}
message SourceServiceResolveResponse {
  string resolved_identity = 1;
  string provenance_digest = 2;
  ArtifactHandle bundle = 3;
  StructuredError error = 4;
}
message SourceServiceGetInvocationRequest {
  CallContext context = 1;
}
message SourceServiceGetInvocationResponse {
  string state = 1;
  SourceServiceResolveResponse result = 2;
  SourceServiceResolveCollectionResponse collection = 3;
}
message SourceServiceCancelRequest {
  CallContext context = 1;
}
message SourceServiceCancelResponse {
  string outcome = 1;
}
// Optional source-collection-v1 capability. Every entry comes from one identity.
message SourceCollectionEntry {
  string key = 1;
  string name = 2;
  string description = 3;
  ArtifactHandle bundle = 4;
}
message SourceServiceResolveCollectionRequest {
  CallContext context = 1;
  string binding_id = 2;
  string reference = 3;
  ExtensionConfiguration configuration = 4;
  bytes credential_envelope = 5;
}
message SourceServiceResolveCollectionResponse {
  string resolved_identity = 1;
  string provenance_digest = 2;
  repeated SourceCollectionEntry entries = 3;
  StructuredError error = 4;
}
service SourceService {
  rpc ResolveCollection(SourceServiceResolveCollectionRequest) returns (SourceServiceResolveCollectionResponse);
  rpc Resolve(SourceServiceResolveRequest) returns (SourceServiceResolveResponse);
  rpc GetInvocation(SourceServiceGetInvocationRequest) returns (SourceServiceGetInvocationResponse);
  rpc Cancel(SourceServiceCancelRequest) returns (SourceServiceCancelResponse);
}

message BuildLimits {
  uint32 timeout_seconds = 1;
  uint32 cpu_millis = 2;
  uint64 memory_bytes = 3;
  uint64 maximum_input_bytes = 4;
  uint64 maximum_output_bytes = 5;
  repeated string allowed_egress = 6;
}
message BuildRecipe {
  string digest = 1;
  ExtensionConfiguration configuration = 2;
  repeated ArtifactHandle inputs = 3;
  repeated string base_image_digests = 4;
  string architecture = 5;
}
message BuilderServiceValidateRequest {
  BuildRecipe recipe = 1;
  BuildLimits limits = 2;
}
message BuilderServiceValidateResponse {
  repeated StructuredError errors = 1;
}
message BuilderServiceBuildRequest {
  ExtensionConfiguration binding_configuration = 6;
  CallContext context = 1;
  string binding_id = 2;
  BuildRecipe recipe = 3;
  BuildLimits limits = 4;
  ArtifactHandle output = 5;
}
message BuilderServiceBuildResponse {
  string state = 1;
  string safe_message = 2;
  ArtifactHandle image = 3;
  string provenance_digest = 4;
  StructuredError error = 5;
}
message BuilderServiceGetInvocationRequest {
  CallContext context = 1;
}
message BuilderServiceGetInvocationResponse {
  BuilderServiceBuildResponse result = 1;
}
message BuilderServiceCancelRequest {
  CallContext context = 1;
}
message BuilderServiceCancelResponse {
  string outcome = 1;
}
service BuilderService {
  rpc Validate(BuilderServiceValidateRequest) returns (BuilderServiceValidateResponse);
  rpc Build(BuilderServiceBuildRequest) returns (stream BuilderServiceBuildResponse);
  rpc GetInvocation(BuilderServiceGetInvocationRequest) returns (BuilderServiceGetInvocationResponse);
  rpc Cancel(BuilderServiceCancelRequest) returns (BuilderServiceCancelResponse);
}

// Artifact transfer is scoped to the invocation and installed process. No URL or
// shared filesystem path crosses this boundary. Receivers enforce digest/size.
message ArtifactTransferServiceReadRequest {
  CallContext context = 1;
  ArtifactHandle artifact = 2;
}
message ArtifactTransferServiceReadResponse {
  bytes chunk = 1;
}
message ArtifactTransferServiceWriteRequest {
  CallContext context = 1;
  ArtifactHandle artifact = 2;
  bytes chunk = 3;
}
message ArtifactTransferServiceWriteResponse {
  ArtifactHandle artifact = 1;
}
service ArtifactTransferService {
  rpc Read(ArtifactTransferServiceReadRequest) returns (stream ArtifactTransferServiceReadResponse);
  rpc Write(stream ArtifactTransferServiceWriteRequest) returns (ArtifactTransferServiceWriteResponse);
}

// Optional provider-owned image import. It does not grant image approval or
// target qualification; old providers continue using inventory images.
message ImageImportServiceImportRequest {
  CallContext context = 1;
  TargetContext target = 2;
  ArtifactHandle artifact = 3;
  string architecture = 4;
  string provenance_digest = 5;
  bytes configuration_json = 6;
}
message TargetImageBinding {
  string image_ref = 1;
  string provider_image_id = 2;
  string artifact_digest = 3;
  string target_configuration_digest = 4;
  string architecture = 5;
  bytes opaque_binding = 6;
}
message ImageImportServiceImportResponse {
  string state = 1;
  TargetImageBinding binding = 2;
  StructuredError error = 3;
}
message ImageImportServiceGetInvocationRequest {
  CallContext context = 1;
  TargetContext target = 2;
}
message ImageImportServiceGetInvocationResponse {
  ImageImportServiceImportResponse result = 1;
}
message ImageImportServiceValidateBindingRequest {
  CallContext context = 1;
  TargetContext target = 2;
  TargetImageBinding binding = 3;
}
message ImageImportServiceValidateBindingResponse {
  bool valid = 1;
  StructuredError error = 2;
}
service ImageImportService {
  rpc Import(ImageImportServiceImportRequest) returns (ImageImportServiceImportResponse);
  rpc GetInvocation(ImageImportServiceGetInvocationRequest) returns (ImageImportServiceGetInvocationResponse);
  rpc ValidateBinding(ImageImportServiceValidateBindingRequest) returns (ImageImportServiceValidateBindingResponse);
}
