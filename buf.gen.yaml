version: v2
plugins:
  - local: protoc-gen-go
    out: api
    opt:
      - paths=source_relative
      - Mapi/plugin/v1/plugin.proto=github.com/OutboundSpade/LabCentral/api/plugin/v1
  - local: protoc-gen-go-grpc
    out: api
    opt:
      - paths=source_relative
      - Mapi/plugin/v1/plugin.proto=github.com/OutboundSpade/LabCentral/api/plugin/v1
