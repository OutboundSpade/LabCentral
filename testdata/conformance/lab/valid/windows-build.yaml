version: 3
name: windows-example
images:
  windows:
    base: windows-2022
    os: windows
    build: {script: build.ps1, files: [build.ps1]}
machines:
  server:
    image: windows
    cpu: 2
    memory: 4Gi
    disk: 30Gi
    access: [desktop, ssh]
inputs:
  count: {type: integer, default: 2}
  enabled: {type: boolean, default: true}
