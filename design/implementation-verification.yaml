notes:
  - TASK-PROD-004 remains intentionally partial. Shared-RWX failover/chaos evidence, 100-instance load/soak evidence, deployment-specific disaster-recovery evidence, and signed publisher releases remain open.
  - TEST-PROD-RECOVERY-001 through TEST-PROD-RECOVERY-005 passed normal and race-enabled CI. The disposable PostgreSQL 18 runner invoked real pg_dump and pg_restore, decrypted and authenticated the set, restored a new database and state root, matched audit/event/job watermarks, and reopened the restored store. The operator-provided database container remains running; every temporary source/restore database was removed.
  - Native recovery proved that a live labd lock excludes backup, SQLite integrity and watermarks survive restoration, and an unsafe second component commits neither the core nor provider destination. The recovery binary also cross-compiled for the Windows archive while native SQLite/systemd commands remain explicitly POSIX-only.
  - Clean commit 4af2094 produced two byte-identical 0.2.0-recovery-check Linux/amd64 archives at sha256:4cf2052cae0128e53258745364bc9780601014f813bdef3b172516c01398c2e9. Every extracted checksum passed; the executable, PostgreSQL and recovery runbooks, CycloneDX age v1.3.2 component, and recovery provenance subject were present.
  - TEST-PROD-TOPOLOGY-001 through TEST-PROD-TOPOLOGY-006 passed. The checked-in base remains fail-closed behind an all-zero OCI digest, RFC 5737 egress sentinels, and separately created configuration/secrets.
  - TEST-PROD-TOPOLOGY-007 and TEST-PROD-TOPOLOGY-008 passed. An isolated alternate filesystem root populated from the packaged sysusers definition passed systemd unit verification without changing host accounts or installed units. Offline systemd security exposure was 1.4 for core and 1.3 for each plugin against an enforced maximum of 3.0.
  - Native core, Proxmox, and noVNC use distinct users, non-overlapping per-plugin IPC groups, private systemd credential projections, separate protected state paths, and attached 0770/0660 Unix IPC. All non-loopback IP traffic remains denied until an operator installs the exact Proxmox address; TCP/8006 restriction remains a documented UID-scoped host-firewall obligation.
  - Disposable k3s v1.34.6 accepted the rendered Namespace, ServiceAccount, Services, PVC, StatefulSet, PDB, and NetworkPolicies under server-side dry-run with Restricted Pod Security. The temporary namespace was deleted and the pre-existing disabled k3s service was returned to inactive state.
  - Attached provider startup passed with host-first and provider-first ordering over exact 0770/0660 IPC, protected token-file authentication, separate plugin identity, and persistent-health-failure supervision. These tests used local Unix sockets and contacted no provider.
  - The topology-check scratch image built successfully and exported labd, all three official runtime binaries/checksums, the Proxmox source digest, and the system CA bundle without a shell or toolchain. It was a disposable working-tree build, not signed release evidence, and was removed after inspection.
  - The full normal and race-enabled Go suites passed with the disposable PostgreSQL 18 test database. The existing operator-provided test container was retained; every test used its own isolated schema.
  - TEST-PROD-OBS-001 through TEST-PROD-OBS-009 passed normal and race-enabled CI on SQLite and disposable PostgreSQL. Runtime snapshots use database time, worker completions emit only closed operation dimensions, and metrics/recorded spans contained no seeded raw path, query, tenant, token, error, object-identity, or unknown-state canaries.
  - A real scratch-image/Compose rehearsal started from a newly created named volume, proved the copied-up state root was mode 0700, reached container healthy through /ready, served the public API, emitted bounded metrics, and remained healthy after restart. The disposable container and volumes created by both the diagnostic failure and passing rehearsal were removed.
  - Protocol v1.1 is additive; the original descriptor remains the Buf FILE breaking baseline and the Docker provider continues to negotiate v1.0.
  - Fourteen allocation cases passed normal SQLite CI; all applicable cases and the existing job suite passed three race-enabled repetitions on isolated PostgreSQL 18.
  - The earlier PostgreSQL verification container and its per-case schemas were removed after that checkpoint. The current operator-provided disposable PostgreSQL 18 container was retained, while every current test removed its own isolated schema.
  - The Proxmox QEMU T0 suite used only in-memory and local TLS fake APIs with synthetic token/guest/upstream canaries; it contacted no Proxmox target and performed no external mutation.
  - Every TEST-PROXMOX-001 through TEST-PROXMOX-029 case has an executable normal-CI binding. The required target-applicable credentialed T3 cases, real guest probes, signed artifact assembly, and read-only prior-build state/journal rehearsal passed on the disposable testbed.
  - TEST-PROXMOX-029 used an actual child test process plus independent file descriptions to prove journal-wide advisory exclusion and canceled wait behavior. Multi-replica startup now admits Proxmox only when the signed journal path is the exact proxmox-journal sibling of the artifact directory on the already verified shared mount. No Proxmox endpoint was contacted.
  - TEST-PROXMOX-023 used an in-process protocol-v1.1 gRPC provider, synthetic scoped credential canary, and migrated SQLite store; it contacted no external endpoint.
  - TEST-PROXMOX-024 used deterministic synthetic evidence and an in-memory Ed25519 key; it contacted no external endpoint and did not change the production provider gate.
  - The qualification review tool creates protected non-overwriting Ed25519 reviewer keypairs and signs or verifies only closed evidence files. It has no provider client, target execution, claim mutation, or self-approval command; the native release includes it so reviewers can work from an offline host.
  - TEST-PROXMOX-025 exercised its activation guard, closed profile, and exact synthetic claim planning only. No T3 environment variables, target profile, or credential file were configured, so the destructive smoke skipped before any provider call.
  - The credentialed Proxmox lifecycle, isolation, and failure/recovery runners are package-test-only, use the existing private mutation constructor, and cannot be invoked by the production provider binary. They do not emit signed passing evidence individually.
  - TEST-PROXMOX-026 used only synthetic TCP outcomes and local TLS servers. It proved dedicated client and server trust, closed schemas, response/evidence binding, redaction, and effort bounds but contacted no Proxmox endpoint and did not execute inside a guest.
