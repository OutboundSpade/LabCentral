notes:
  - Protocol v1.1 is additive; the original descriptor remains the Buf FILE breaking baseline and the Docker provider continues to negotiate v1.0.
  - Fourteen allocation cases passed normal SQLite CI; all applicable cases and the existing job suite passed three race-enabled repetitions on isolated PostgreSQL 18.
  - The PostgreSQL container and its per-case schemas were removed after verification.
  - The Proxmox QEMU T0 suite used only in-memory and local TLS fake APIs with synthetic token/guest/upstream canaries; it contacted no Proxmox target and performed no external mutation.
  - Every TEST-PROXMOX-001 through TEST-PROXMOX-027 case has an executable normal-CI binding. Exact-target credentialed T3 execution and real guest connectivity probes remain outstanding.
  - TEST-PROXMOX-023 used an in-process protocol-v1.1 gRPC provider, synthetic scoped credential canary, and migrated SQLite store; it contacted no external endpoint.
  - TEST-PROXMOX-024 used deterministic synthetic evidence and an in-memory Ed25519 key; it contacted no external endpoint and did not change the production provider gate.
  - The qualification review tool signs or verifies only closed evidence files. It has no provider client, target execution, claim mutation, or capability-enablement command and is not included in the production release artifacts.
  - TEST-PROXMOX-025 exercised its activation guard, closed profile, and exact synthetic claim planning only. No T3 environment variables, target profile, or credential file were configured, so the destructive smoke skipped before any provider call.
  - The credentialed Proxmox smoke is package-test-only, uses the existing private mutation constructor, and cannot be invoked by the production provider binary. It does not claim full T3 qualification or emit signed passing evidence.
  - TEST-PROXMOX-026 used only synthetic TCP outcomes and local TLS servers. It proved dedicated client and server trust, closed schemas, response/evidence binding, redaction, and effort bounds but contacted no Proxmox endpoint and did not execute inside a guest.
  - The standalone probe agent is a qualification fixture excluded from production release packaging. Its configured image digest is bound evidence rather than runtime attestation; the future runner must rebind it to the approved exact template and content digest.
  - TEST-PROXMOX-027 proved exact synthetic planning for source and peer guests on one VLAN plus a distinct-instance guest on a second VLAN. No isolation activation variables, profile, credentials, or probe PKI were configured, so its destructive binding skipped before file or network access.
  - The isolation runner maps a successful response into typed ProbeEvidence in memory and performs reverse owned cleanup with fresh VM absence checks. It neither emits a complete qualification artifact nor covers the remaining T3 failure/recovery cases.
  - Optional Proxmox startup persists only redacted expiring discovery evidence; target configuration and credential envelopes are not stored in SQLite.
  - The production Proxmox constructor has no path that opens mutation execution; workload.vm and start/stop/pause/resume remain unsupported there.
  - PostgreSQL conformance used an isolated temporary PostgreSQL 18 container; the container and per-case schemas were removed after the run.
  - The credentialed Docker smoke test used Docker Engine 29.7.2 / API 1.55 on Linux amd64 and the two immutable Example A image digests.
  - Example A reached ready at a provider-selected 127.0.0.1 port and returned {"service":"LabCentral Example A","visits":1} before destroy succeeded.
  - Post-destroy checks found zero instance-labeled containers, networks, and volumes; diagnostic failed attempts were also compensated without leftovers.
  - Docker images remain in the normal Engine cache and were not deleted.
  - Two consecutive WEB_VERSION=dev builds with source scanning bounded to web/src had identical content-tree SHA-256 052b33c10a58f9b68ec2d04ebec03e3002bdaf5d70b1c9f9a1b1aa5917b4f05e.
  - Two native linux/amd64 archives built from the same source epoch had identical SHA-256 2d9fd674c84eaabb2dcdf337f6c6eec50cc04f623d843e42da678d67558a8238; every packaged checksum verified.
  - The emitted SBOM passed the official CycloneDX 1.6 JSON schema with 142 application/library components.
  - The final scratch image was 14,895,823 compressed bytes and exported only labd, lab-provider-docker, and the provider checksum beyond Docker runtime mount points; no shell or build toolchain was present.
  - Compose exposed labd only at 127.0.0.1:18082 through host networking. docker top showed docker-init, labd, and a distinct lab-provider-docker child.
  - The first request immediately after ready received one connection reset; the bounded retry returned {"service":"LabCentral Example A","visits":1}. Destroy then left zero labeled objects.
  - Restarting the Compose service retained the destroyed instance record in the named volume. The isolated test container and volume were removed after verification.
