  - ADR-0017
  contract: design/contracts/architecture-conformance.yaml
  localResult: pass
  checks:
  - Full race-enabled Go suite with disposable PostgreSQL 18, local fake HTTP/gRPC services, and live credentialed
    Proxmox runners explicitly excluded.
  - Targeted normal Go tests for typed revisions, stream outcomes, manifest loading, external SDK installation,
    queue filtering, cleanup authority and source identity.
  - Go vet; complete design/protocol/schema/link/ADR-state verifier; generated OpenAPI and frontend DTOs; Svelte
    type check and static build.
  - Go vulnerability scan found no reachable vulnerabilities; frontend lockfile scan found no issues.
  compatibility:
  - Existing migration checksums and protobuf state bytes preserved; additive migration 0012_template_representations.
  - ADR-0011, ADR-0012 and ADR-0014 retained as superseded historical decisions.
  - Provider source identity is now content-based over the build dependency closure; prior exact-build qualification
    does not transfer.
  excluded:
  - No live provider qualification or infrastructure mutation was performed for this refactor.
  - TASK-PROD-004 live load/soak, cross-node journal failover/DR and protected publisher ceremony remain open.
  evidenceInterpretation: Earlier production/testbed entries in this file describe their recorded binaries and checkpoints;
    they do not qualify the architecture-refactor binary.
architectureCIHardening:
  finding: Hosted 100-instance concurrency testing exposed an unhandled PostgreSQL 40001 during worker policy checks.
  reproduction: TEST-ARCH-012 deterministically holds the job row, starts a serializable policy or quota transaction,
    then commits a lease renewal to invalidate its first snapshot.
  fix: Apply bounded existing transaction-conflict retries to apply-policy checks and quota retention; recheck fences
    each attempt and never replay provider calls.
  validation: The deterministic PostgreSQL conflict test passed three race-enabled repetitions; the 100-instance
    multi-replica test passed five race-enabled repetitions after the fix.
browserStartupRepair:
  date: '2026-09-06'
  task: TASK-PROD-005
  contract: TEST-PROD-RELEASE-001
  reproduction: The live production export rendered an empty body in Playwright 1.55 WebKit with an uninitialized
    template-function error; disabling minification did not resolve it.
  fix: Defer noVNC initialization until an authorized console request; contain module-loading failures and prevent
    late connections after unmount.
  regression: web/tests/startup.mjs serves the production export with a credential-free API fixture and verifies
