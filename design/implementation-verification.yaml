  - The mutation contract verification contacted no Proxmox target and performed no mutation; it defines prerequisites and future T0/T3 cases only.
  - The Proxmox foundation used only local TLS fake APIs and synthetic token canaries; it contacted no Proxmox target and performed no mutation.
  - PostgreSQL conformance used an isolated temporary PostgreSQL 18 container; the container and per-case schemas were removed after the run.
  - The credentialed smoke test used Docker Engine 29.7.2 / API 1.55 on Linux amd64 and the two immutable Example A image digests.
  - Example A reached ready at a provider-selected 127.0.0.1 port and returned {"service":"LabCentral Example A","visits":1} before destroy succeeded.
  - Post-destroy checks found zero instance-labeled containers, networks, and volumes; diagnostic failed attempts were also compensated without leftovers.
  - Docker images remain in the normal Engine cache and were not deleted.
  - Two consecutive WEB_VERSION=dev builds with source scanning bounded to web/src had identical content-tree SHA-256 052b33c10a58f9b68ec2d04ebec03e3002bdaf5d70b1c9f9a1b1aa5917b4f05e.
  - Two native linux/amd64 archives built from the same source epoch had identical SHA-256 2d9fd674c84eaabb2dcdf337f6c6eec50cc04f623d843e42da678d67558a8238; every packaged checksum verified.
  - The emitted SBOM passed the official CycloneDX 1.6 JSON schema with 142 application/library components.
  - The final scratch image was 14,895,823 compressed bytes and exported only labd, lab-provider-docker, and the provider checksum beyond Docker runtime mount points; no shell or build toolchain was present.
  - Compose exposed labd only at 127.0.0.1:18082 through host networking. docker top showed docker-init, labd, and a distinct lab-provider-docker child.
  - The first request immediately after ready received one connection reset; the bounded retry returned {"service":"LabCentral Example A","visits":1}. Destroy then left zero labeled objects.
  - Restarting the Compose service retained the destroyed instance record in the named volume. The isolated test container and volume were removed after verification.
