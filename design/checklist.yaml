  - id: TASK-RELEASE-001
    title: Package the laptop slice for native archive, Docker, and Compose
    status: complete
    dependencies: [TASK-DOCKER-001]
    relatedAdrs: [ADR-0001, ADR-0002, ADR-0004, ADR-0011]
    relatedDocuments: [docs/design/deployment.md, docs/design/provider-roadmap.md, docs/design/testing.md, docs/references.md]
    acceptanceCriteria:
      - A deterministic native archive contains separate labd and Docker-provider executables, verified checksums, a plugin manifest, CycloneDX SBOM, and source/build provenance.
      - A pinned multi-stage image excludes Bun and the Go toolchain at runtime and still launches the verified provider as a separate process.
      - Docker Compose persists local data, mounts only the selected Docker socket, uses host networking for loopback semantics, and passes the Example A apply/access/destroy smoke test without labeled leftovers.
      - Documentation states the Docker socket privilege, no-auth, host-networking, and platform limitations without weakening the trusted-laptop warning.
  - id: TASK-PROXMOX-001
    title: Implement read-only Proxmox target discovery and capability evidence
    status: complete
    dependencies: [TASK-PLUGIN-001, TASK-PROVIDER-001]
    relatedAdrs: [ADR-0002, ADR-0003, ADR-0004, ADR-0007]
    relatedDocuments: [docs/design/proxmox-provider.md, docs/design/provider-contract.md, docs/design/provider-capability-matrix.md, docs/design/provider-roadmap.md, docs/design/security-threat-model.md, docs/design/testing.md, docs/references.md]
    acceptanceCriteria:
      - A separately runnable Proxmox provider accepts only strict typed HTTPS target configuration and target-scoped API-token credentials, verifies TLS, refuses redirects, bounds responses, and performs GET requests only.
      - Discovery returns a deterministic typed inventory of nodes, QEMU availability/templates, bridges/VLAN awareness, and VM-image storage/formats without persisting or logging credentials.
      - Capability and capacity output cites target evidence, distinguishes unavailable or constrained features, expires, and never infers snapshot, firewall, access, or placement support merely from provider type.
      - Fake-API and TLS tests cover deterministic ordering/digest, authorization, malformed envelopes, response limits, partial/offline inventory, error redaction, and unsupported mutation behavior without real credentials.
  - id: TASK-PROXMOX-002
    title: Specify the first Proxmox QEMU mutation and integration contract
    status: complete
    dependencies: [TASK-PROXMOX-001, TASK-JOBS-001]
    relatedAdrs: [ADR-0002, ADR-0003, ADR-0004, ADR-0006, ADR-0007, ADR-0013]
    relatedDocuments: [docs/design/proxmox-provider.md, docs/design/proxmox-qemu-mutation.md, docs/design/provider-contract.md, docs/design/networking.md, docs/design/guest-provisioning.md, docs/design/reconciliation-and-jobs.md, docs/design/security-threat-model.md, docs/design/testing.md, design/contracts/proxmox-qemu-mutation.yaml, design/verification.yaml, design/implementation-verification.yaml]
    acceptanceCriteria:
      - A typed plan contract fixes the supported Linux QEMU template-clone, disk, approved bridge/VLAN, cloud-init, lifecycle, and output subset without generic executable configuration.
      - Target discovery and planning identify the exact API permissions, component/storage/network constraints, and integration versions required before any mutation capability is advertised.
      - Provider state, idempotency, task polling, unknown outcomes, ownership fencing, reverse destroy, compensation, and leftover reporting are specified against the accepted plugin/job contracts.
      - A credentialed T3 test matrix and deterministic fake-API cases cover success and every provider failure window before implementation is proposed.
  - id: TASK-PROXMOX-003
    title: Implement allocation and protocol prerequisites for Proxmox mutation
    status: complete
    dependencies: [TASK-PROXMOX-002]
    relatedAdrs: [ADR-0002, ADR-0006, ADR-0011, ADR-0012, ADR-0013]
    relatedDocuments: [api/plugin/v1/plugin.proto, api/plugin/v1/compat, internal/application, internal/adapter/jobsdb, internal/controlplane, internal/pluginhost, pkg/plugin-sdk-go, docs/design/domain-ports.md, docs/design/database-schema.md, docs/design/plugin-system.md, docs/design/provider-contract.md, docs/design/proxmox-qemu-mutation.md, docs/design/reconciliation-and-jobs.md, docs/design/testing.md, design/contracts/allocation-claims.yaml, design/contracts/proxmox-qemu-mutation.yaml]
    acceptanceCriteria:
      - The core assigns a stable Instance ID before planning and SQLite/PostgreSQL adapters atomically enforce bounded opaque target allocation claims with held, committed, orphaned, and released states.
      - An additive plugin v1 minor feature negotiation carries instance identity, excluded claims, dependency plans/states, proposed claims, and committed claims without breaking the accepted descriptor baseline.
      - Planning conflict, job restart, unknown invocation, compensation, leftover, and destroy paths retain or release claims exactly as ADR-0013 requires.
      - Shared conformance tests prove deterministic bounded replanning, target isolation, persistence parity, protocol downgrade behavior, and absence-gated release before Proxmox write code begins.
  - id: TASK-PROXMOX-004
    title: Implement the gated Proxmox QEMU mutation and T0 suite
    status: complete
    dependencies: [TASK-PROXMOX-003]
    relatedAdrs: [ADR-0002, ADR-0003, ADR-0004, ADR-0006, ADR-0007, ADR-0013]
    relatedDocuments: [providers/proxmox, cmd/lab-provider-proxmox, docs/design/proxmox-provider.md, docs/design/proxmox-qemu-mutation.md, docs/design/provider-contract.md, docs/design/security-threat-model.md, docs/design/testing.md, design/contracts/proxmox-qemu-mutation.yaml]
    acceptanceCriteria:
      - Strict closed target-config v1.1, QEMU plan v1.0, provider-state v1.0, and invocation-journal v1.0 types implement only the accepted fixed-node Linux full-clone subset.
      - Validate, plan, apply, read, destroy, GetInvocation, and start/stop/pause/resume use only the allowlisted Proxmox APIs, committed claims/dependency states, ownership markers, optimistic config digests, and bounded UPID polling.
      - Every TEST-PROXMOX case has a deterministic fake-API binding covering response loss, restart, task/config failure, compensation, ownership refusal, redaction, and unsupported input without real credentials.
      - Mutation remains disabled by default and unadvertised unless the local protocol/config/evidence gates pass; production support remains blocked on the later exact-target credentialed T3 qualification.
  - id: TASK-PROXMOX-005
    title: Integrate Proxmox targets and execute credentialed T3 qualification
    status: complete
    dependencies: [TASK-PROXMOX-004]
    relatedAdrs: [ADR-0002, ADR-0003, ADR-0004, ADR-0006, ADR-0007, ADR-0013, ADR-0014]
    relatedDocuments: [providers/proxmox, internal/controlplane, internal/pluginhost, tools/proxmox-qualification, tools/proxmox-probe-agent, tools/provider-testenv, docs/design/proxmox-provider.md, docs/design/proxmox-qemu-mutation.md, docs/design/deployment.md, docs/design/security-threat-model.md, docs/design/testing.md, design/contracts/proxmox-qemu-mutation.yaml, design/contracts/proxmox-t3-smoke-profile.schema.json, design/contracts/proxmox-t3-isolation-profile.schema.json, design/contracts/proxmox-qualification-probe-request.schema.json, design/contracts/proxmox-qualification-probe-response.schema.json]
    acceptanceCriteria:
      - Provider-target registration, secret-backed credential delivery, supervision, protocol v1.1 negotiation, capability persistence, allocation commits, and dependency states drive the Proxmox provider without weakening the Docker slice.
      - Isolated opt-in T3 runs record exact PVE 9.x, storage, bridge, permission, template, VMID, and VLAN evidence and pass every applicable TEST-PROXMOX case with automatic owned cleanup.
      - Positive intended-segment and negative management/cross-instance connectivity probes are measured on real guests, and failed or ambiguous cleanup retains claims and blocks capability advertisement.
      - The closed exact-target artifact verifies all expected bindings, and the current reader accepts prior-build journal/state v1.0 records without mutation, before production-enablement review begins.
      - A separate reviewed production-enablement decision consumes signed qualification evidence; no configuration-only or test-constructor bypass can open writes.
  - id: TASK-PROXMOX-006
    title: Harden, package, and verify the single-operator Proxmox production deployment
    status: complete
    dependencies: [TASK-PROXMOX-005, TASK-RELEASE-001]
    relatedAdrs: [ADR-0001, ADR-0002, ADR-0003, ADR-0006, ADR-0008, ADR-0011, ADR-0014]
    relatedDocuments: [cmd/labd, cmd/lab-provider-proxmox, internal/controlplane, internal/pluginhost, providers/proxmox, tools/release, tools/proxmox-qualification, deploy/proxmox, docs/operations/proxmox-deployment.md, docs/design/deployment.md, docs/design/plugin-system.md, docs/design/proxmox-provider.md, docs/design/security-threat-model.md, docs/design/testing.md, design/contracts/proxmox-qualification-trust.schema.json]
    acceptanceCriteria:
      - The only exported production mutation constructor requires a signed-evidence authorizer that rebinds active non-revoked reviewer trust, evidence age, exact target/configuration/PVE/build facts, and fresh normalized live profile before capability advertisement and every apply, destroy, or lifecycle write.
      - Proxmox-only startup, two-minute target refresh, redacted target status API/UI, protected target/credential inputs, and an immutable checksum-verified plugin execution snapshot work without Docker authority; terminal child failure causes the service manager to restart the whole single-node deployment.
      - A clean-tree deterministic native release contains both providers, the qualification verifier, binary/source checksums, manifests, SBOM/provenance, strict examples, a hardened service unit, and an operator runbook; all contents and service syntax are verified after extraction.
      - The current release candidate passes normal/race/static/design suites and a fresh exact-build disposable-target qualification, signed artifact verification, authorized start/status/create/lifecycle/destroy, restart recovery, and independent absence checks.
  - id: TASK-PROD-001
    title: Implement the PostgreSQL production control-plane store and multi-replica fencing
    status: complete
    dependencies: [TASK-PROXMOX-006, TASK-JOBS-001]
    relatedAdrs: [ADR-0001, ADR-0006, ADR-0011, ADR-0013]
    relatedDocuments: [internal/application, internal/adapter/jobsdb, internal/adapter/localdb, internal/controlplane, docs/design/database-schema.md, docs/design/persistence-and-artifacts.md, docs/design/reconciliation-and-jobs.md, docs/design/testing.md]
    acceptanceCriteria:
      - PostgreSQL implements every durable control-plane Store transaction and migration used by instances, resources, plans, operations, target snapshots, claims, idempotency, audit, events, outbox, quotas, and jobs with parity against SQLite conformance.
      - Multiple control-plane workers preserve database-time leasing, monotonic fencing, single terminal finalization, allocation uniqueness, and unknown-outcome recovery under crash, delay, and network-partition tests.
      - Startup selects SQLite only for local single-node mode and requires PostgreSQL plus shared durable artifacts for multi-replica mode; backup and restore compatibility are tested.
  - id: TASK-PROD-002
    title: Implement HTTPS, local and OIDC authentication, tenancy, and scope-aware RBAC
    status: complete
    dependencies: [TASK-PROD-001]
    relatedAdrs: [ADR-0009, ADR-0010, ADR-0011]
    relatedDocuments: [api/http, internal/application, internal/controlplane, web, docs/design/auth-tenancy-rbac.md, docs/design/http-api.md, docs/design/security-threat-model.md, docs/design/testing.md]
    acceptanceCriteria:
      - TLS configuration, trusted-proxy handling, secure cookies, CSRF protection, local password hashing/recovery, OIDC authorization-code/PKCE/state/nonce validation, session rotation/revocation, and secret-key rotation are implemented and adversarially tested.
      - Organizations, projects, teams, memberships, role assignments, and target grants are durably scoped; handlers authorize every read and mutation through application policy before data access or secret resolution.
      - No-auth remains an explicit loopback-only development mode, while production startup refuses non-loopback operation without TLS and an authenticated mode.
  - id: TASK-PROD-003
    title: Implement classroom governance, reusable templates, expiration, audit, and controlled access
    status: in_progress
    dependencies: [TASK-PROD-002]
    relatedAdrs: [ADR-0004, ADR-0006, ADR-0008, ADR-0009, ADR-0010]
    relatedDocuments: [api/http, internal/application, internal/adapter/localdb, internal/controlplane, web, docs/design/access-sessions.md, docs/design/auth-tenancy-rbac.md, docs/design/database-schema.md, docs/design/http-api.md, docs/design/persistence-and-artifacts.md, docs/design/reconciliation-and-jobs.md, docs/design/security-threat-model.md, design/contracts/governance-quotas.yaml, design/contracts/classroom-batches.yaml, design/contracts/access-conformance.yaml]
    acceptanceCriteria:
      - Versioned Lab Templates/revisions and classroom batch instantiation support 20-100 concurrent isolated instances with per-scope quotas, reservations, expiration, renewal, and safe cleanup/orphan review.
      - Append-only audit/event records cover authentication, authorization, target, template, operation, access, and administrator actions with bounded redacted retention/export.
      - A separate access plugin issues short-lived ownership-bound SSH/console sessions without exposing provider credentials or management endpoints and supports revocation plus authorization recheck.
  - id: TASK-PROD-004
    title: Validate and package the supported classroom production topology
    status: proposed
    dependencies: [TASK-PROD-003]
    relatedAdrs: [ADR-0001, ADR-0002, ADR-0006, ADR-0008, ADR-0011]
    relatedDocuments: [deploy, tools/release, docs/design/deployment.md, docs/design/security-threat-model.md, docs/design/testing.md]
    acceptanceCriteria:
      - Supported native and Kubernetes deployment assets include PostgreSQL, shared artifact storage, TLS/identity secrets, dedicated provider identities, network policy, disruption/upgrade strategy, encrypted backup/restore, metrics, traces, alerts, and documented key/token rotation.
      - Load, soak, chaos, upgrade, restore, credential-revocation, evidence-expiry, and disaster-recovery tests meet documented service objectives at the 100-instance classroom target without cross-tenant access or leaked secrets.
      - Reproducible signed release artifacts, compatibility matrix, SBOM/provenance, vulnerability response, operator runbook, and clean install/upgrade/rollback evidence are independently reviewed before the production milestone is complete.
