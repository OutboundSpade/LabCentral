  - id: TASK-CONTRACT-001
    title: Define executable Phase 0 conformance and threat-control catalogs
    status: complete
    dependencies: [TASK-DESIGN-005, TASK-DESIGN-006, TASK-PLUGIN-001, TASK-SCHEMA-001]
    relatedAdrs: [ADR-0002, ADR-0006, ADR-0007, ADR-0008]
    relatedDocuments: [design/contracts, tools/verify_phase0.py]
    acceptanceCriteria:
      - Provider failure windows and destructive ownership safeguards have stable test IDs.
      - Job invariants cover atomic outbox, leases, fencing, unknown outcomes, idempotency, and quotas.
      - Every threat has explicit owners, controls, and defined test IDs.
      - The Phase 0 design verifier passes without contacting a provider.
  - id: TASK-DOMAIN-001
