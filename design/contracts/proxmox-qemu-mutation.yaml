formatVersion: 1
suite: labcentral.proxmox-qemu-mutation/v1alpha1
status: production_authorizer_implemented_packaging_in_progress
provider: proxmox
initialRelease:
  pveRange: ">=9.0.0 <10.0.0"
  architecture: amd64
  workload: linux_qemu_full_clone
  placement: fixed_node
  networks: approved_vlan_aware_linux_bridge
  addressFamily: ipv4_static
schemas:
  targetConfig: {name: proxmox.target-config, version: 1.1}
  plan: {name: proxmox.qemu-plan, version: 1.0}
  providerState: {name: proxmox.qemu-state, version: 1.0}
  invocationJournal: {name: proxmox.invocation-journal, version: 1.0}
requiredProtocolFeatures:
  - stable_instance_identity_before_plan
  - opaque-allocation-claims-v1
  - excluded_claims_on_replan
  - dependency-resource-input-v1
  - durable_get_invocation
allocationClaims:
  uniqueKey: [targetID, namespace, value]
  namespaces: [proxmox.qemu.vmid, proxmox.network.vlan]
  states: [held, committed, orphaned, released]
  releaseCondition: provider_absence_confirmed
qualificationEvidence:
  status: testbed_signed_and_verified_ready_for_independent_review
  evidenceSchema: labcentral.proxmox-qualification-evidence/v1
  envelopeSchema: labcentral.proxmox-qualification-envelope/v1
  canonicalization: RFC_8785
  signature:
    algorithm: Ed25519
    encoding: unpadded_base64url
    domainSeparated: true
  exactBindings:
    - target_id
    - installation_id
    - target_configuration_sha256
    - capability_sha256
    - inventory_sha256
    - policy_sha256
    - pve_manager_release_and_build
    - provider_binary_and_source_tree_sha256
    - negotiated_protocol_and_features
    - destination_node_storage_bridge_permissions_template_and_disposable_ranges
  requiredT3Cases:
    - TEST-PROXMOX-003
    - TEST-PROXMOX-004
    - TEST-PROXMOX-005
    - TEST-PROXMOX-007
    - TEST-PROXMOX-008
    - TEST-PROXMOX-009
    - TEST-PROXMOX-010
    - TEST-PROXMOX-011
    - TEST-PROXMOX-012
    - TEST-PROXMOX-013
    - TEST-PROXMOX-014
    - TEST-PROXMOX-015
    - TEST-PROXMOX-017
    - TEST-PROXMOX-018
    - TEST-PROXMOX-019
    - TEST-PROXMOX-022
  isolationProbes:
    requiredOrder: [intended_segment, management, cross_instance]
    minimumAttempts: 3
    passCondition: intended_all_succeed_and_negative_all_fail
    transcriptStorage: sha256_digest_only
  cleanup:
    qualifyingCondition: provider_absence_confirmed_and_no_leftovers_and_all_claims_released
    failureCondition: retain_or_orphan_claims_and_block_capability
  productionEnablement: adr_0014_authorizer_implemented_exact_release_requalification_required
productionAuthorization:
  status: implemented_fail_closed
  decision: ADR-0014
  trustSchema: labcentral.proxmox-qualification-trust/v1
  trustSchemaFile: design/contracts/proxmox-qualification-trust.schema.json
  defaultConstructor: discovery_only
  writeConstructor: requires_non_nil_mutation_authorizer
  checks:
    - active_non_revoked_reviewer_key_and_deployment_maximum_age
    - complete_passing_signed_case_probe_and_cleanup_evidence
    - exact_target_installation_configuration_capability_inventory_and_policy
    - exact_pve_release_build_provider_binary_and_source_tree
    - exact_protocol_plugin_and_normalized_live_profile
  evaluationPoints: [capability_discovery, apply, destroy, lifecycle]
  failureBehavior: unsupported_or_qualification_gate_closed_before_write
credentialedSmokeHarness:
  status: implemented_executed_two_storage_profiles
  profileSchema: labcentral.proxmox-t3-smoke-profile/v1
  profileSchemaFile: design/contracts/proxmox-t3-smoke-profile.schema.json
  activation:
    exactSentinel: I_ACKNOWLEDGE_LABCENTRAL_PROXMOX_T3_DESTRUCTIVE
    targetSpecificConfirmation: required
    absoluteDistinctInputPaths: required
  operations:
    - read_only_discovery_and_exact_preflight
    - plan_and_bind_confirmed_disposable_vmid_and_vlan
    - create_network_and_single_qemu_full_clone
    - stop_start_pause_resume
    - ownership_checked_reverse_destroy
    - provider_absence_confirmation
  cleanupTimeoutSeconds: 300
  defaultBehavior: skipped_with_zero_provider_calls
  qualifyingEvidence: false
credentialedFailureRecoveryHarness:
  status: implemented_executed_once
  profileSchema: labcentral.proxmox-t3-smoke-profile/v1
  profileSchemaFile: design/contracts/proxmox-t3-smoke-profile.schema.json
  activation:
    exactSentinel: I_ACKNOWLEDGE_LABCENTRAL_PROXMOX_T3_DESTRUCTIVE
    targetSpecificConfirmation: required
    absoluteDistinctInputPaths: 3
  boundaryFaults:
    - permission_or_inventory_read_substitution
    - response_loss_after_confirmed_PVE_acceptance
    - synthetic_failed_task_before_object_creation
    - stale_config_digest_rejection_by_PVE
    - compensation_delete_rejection_before_PVE_request
  guarantees:
    injectedAndNativeOutcomesDistinguished: true
    mutationCallsCounted: true
    everyDurableCheckpointRestarted: true
    corruptJournalFailsClosed: true
    ownedCleanupTimeoutSeconds: 600
    providerAbsenceRechecked: true
  defaultBehavior: skipped_with_zero_provider_calls
  qualifyingEvidence: false
qualificationProbe:
  status: protocol_agent_and_client_executed_on_guest
  requestSchema: labcentral.proxmox-qualification-probe-request/v1
  requestSchemaFile: design/contracts/proxmox-qualification-probe-request.schema.json
  responseSchema: labcentral.proxmox-qualification-probe-response/v1
  responseSchemaFile: design/contracts/proxmox-qualification-probe-response.schema.json
  transport:
    protocol: HTTPS_HTTP_1_1
    tlsMinimum: "1.3"
    clientAuthentication: dedicated_CA_mTLS_required
    agentOrigin: exact_non_loopback_ipv4_and_unprivileged_port
    redirectsAndProxies: disabled
  operation:
    method: POST
    path: /v1/probes
    behavior: bounded_TCP_connect_only
    shellOrGuestExec: false
    singleFlight: true
  limits:
    bodyBytes: 16384
    orderedTargets: [intended_segment, management, cross_instance]
    attempts: {minimum: 3, maximum: 10}
    timeoutMillis: {minimum: 100, maximum: 5000}
  evidence:
    nonceBound: true
    agentImageDigestBound: true
    rawTargetAddressesReturned: false
    canonicalTranscriptDigest: sha256
  productionRole: none_qualification_fixture_only
credentialedIsolationHarness:
  status: implemented_executed_evidence_grade
  profileSchema: labcentral.proxmox-t3-isolation-profile/v1
  profileSchemaFile: design/contracts/proxmox-t3-isolation-profile.schema.json
  activation:
    exactSentinel: I_ACKNOWLEDGE_LABCENTRAL_PROXMOX_T3_DESTRUCTIVE
    targetSpecificConfirmation: required
    absoluteDistinctInputPaths: 6
  topology:
    sourceInstance: {networks: 1, guests: 2}
    crossInstance: {networks: 1, guests: 1}
    distinctVMIDs: 3
    distinctVLANs: 2
  probe:
    origin: source_guest_exact_ipv4
    destinations: [intended_peer, management, cross_instance_guest]
    evidenceMapping: typed_probe_records_for_signed_evidence
  cleanup:
    order: reverse_dependency
    perResourceTimeoutSeconds: 600
    vmAbsenceRechecked: true
  defaultBehavior: skipped_with_zero_provider_calls
  qualifyingEvidence: false
upgradeReadabilityHarness:
  status: implemented_executed_read_only
  activation:
    exactSentinel: I_ACKNOWLEDGE_LABCENTRAL_PROXMOX_T4_READ_ONLY_UPGRADE
    absoluteJournalDirectory: required
    exactTargetID: required
    priorBuildInvocationIDs: 3_to_32_distinct
  coverage:
    - checksummed_invocation_journal_v1_0
    - network_provider_state_v1_0
    - vm_provider_state_v1_0
    - destroyed_tombstone
  providerClientConstructed: false
  mutationPath: none
  defaultBehavior: skipped_before_journal_access
capabilityGate:
  requiredFacts:
    - supported_pve_9_release
    - effective_permissions_match_configured_scopes
    - template_config_and_operator_digest_match
    - fixed_node_online
    - storage_profile_and_format_match
    - vlan_aware_bridge_profile_matches
    - management_isolation_attested_and_probed
    - core_allocation_protocol_negotiated
    - durable_journal_healthy
    - exact_target_matrix_passed_t3
  beforeGate:
    workload.vm: unsupported
    lifecycle.start: unsupported
    lifecycle.stop: unsupported
    lifecycle.pause: unsupported
    lifecycle.resume: unsupported
  neverImplied:
    - lifecycle.clone
    - lifecycle.snapshot
    - lifecycle.restore
    - lifecycle.reset
    - access.browser
    - placement.dynamic
allowedApi:
  - {method: GET, path: /access/permissions, purpose: effective_permission_gate}
  - {method: GET, path: /cluster/nextid, purpose: advisory_collision_preflight}
  - {method: GET, path: "/nodes/{node}/qemu/{vmid}/config", purpose: template_ownership_and_drift_read}
  - {method: POST, path: "/nodes/{node}/qemu/{vmid}/clone", purpose: full_clone}
  - {method: POST, path: "/nodes/{node}/qemu/{vmid}/config", purpose: safe_managed_configuration}
  - {method: GET, path: "/nodes/{node}/qemu/{vmid}/status/current", purpose: lifecycle_observation}
  - {method: POST, path: "/nodes/{node}/qemu/{vmid}/status/start", purpose: start}
  - {method: POST, path: "/nodes/{node}/qemu/{vmid}/status/shutdown", purpose: graceful_stop}
  - {method: POST, path: "/nodes/{node}/qemu/{vmid}/status/suspend", purpose: pause_without_disk_state}
  - {method: POST, path: "/nodes/{node}/qemu/{vmid}/status/resume", purpose: resume}
  - {method: POST, path: "/nodes/{node}/qemu/{vmid}/agent/ping", purpose: bounded_readiness_probe}
  - {method: GET, path: "/nodes/{node}/tasks/{upid}/status", purpose: async_task_status}
  - {method: DELETE, path: "/nodes/{node}/qemu/{vmid}", purpose: owned_vm_cleanup}
forbiddenInputs:
  - generic_maps
  - qemu_args
  - hookscripts
  - host_pci_or_usb_passthrough
  - virtiofs_or_host_paths
  - raw_disks_or_physical_interfaces
  - arbitrary_cloud_init_or_cicustom
  - ignition_or_author_files
  - guest_passwords_or_secrets
  - volumes_or_mounts
  - external_networks_or_trunks
  - ipv6_or_provider_managed_ipam
  - snapshots_restore_reset_or_user_clone
  - force_skiplock_purge_or_destroy_unreferenced
permissions:
  required:
    - VM.Audit
    - VM.Clone
    - VM.Allocate
    - VM.Config.CPU
    - VM.Config.Memory
    - VM.Config.Network
    - VM.Config.Cloudinit
    - VM.Config.Options
    - VM.PowerMgmt
    - VM.GuestAgent.Audit
    - Datastore.Audit
    - Datastore.AllocateSpace
    - SDN.Use
    - Sys.Audit
  forbiddenBroadening:
    - VM.GuestAgent.Unrestricted
    - Sys.Modify
    - direct_datastore_delete
    - cluster_administrator
covers:
  TEST-PROVIDER-001: [TEST-PROXMOX-001, TEST-PROXMOX-005, TEST-PROXMOX-006]
  TEST-PROVIDER-002: [TEST-PROXMOX-002]
  TEST-PROVIDER-003: [TEST-PROXMOX-004, TEST-PROXMOX-013]
  TEST-PROVIDER-004: [TEST-PROXMOX-005, TEST-PROXMOX-011]
  TEST-PROVIDER-005: [TEST-PROXMOX-005, TEST-PROXMOX-012]
  TEST-PROVIDER-006: [TEST-PROXMOX-007, TEST-PROXMOX-008]
  TEST-PROVIDER-007: [TEST-PROXMOX-009]
  TEST-PROVIDER-008: [TEST-PROXMOX-009, TEST-PROXMOX-014]
  TEST-PROVIDER-009: [TEST-PROXMOX-011]
  TEST-PROVIDER-010: [TEST-PROXMOX-011]
  TEST-PROVIDER-011: [TEST-PROXMOX-002, TEST-PROXMOX-003, TEST-PROXMOX-019]
  TEST-PROVIDER-012: [TEST-PROXMOX-007]
  TEST-PROVIDER-013: [TEST-PROXMOX-012]
  TEST-PROVIDER-014: [TEST-PROXMOX-016, TEST-PROXMOX-022]
  TEST-PROVIDER-015: [TEST-PROXMOX-001]
  TEST-PROVIDER-016: [TEST-PROXMOX-011, TEST-PROXMOX-012]
  TEST-PROVIDER-017: [TEST-PROXMOX-014]
  TEST-PROVIDER-018: [TEST-PROXMOX-013]
cases:
  - id: TEST-PROXMOX-001
    title: Deterministic typed plan binds committed claims
    layer: T0
    testBinding: "providers/proxmox/planning_test.go#TestValidateAndPlanClosedProxmoxSubsetDeterministically"
    expect: {identicalPlanBytes: true, claimsUnique: true, applyUsesCommittedClaimsOnly: true, mutations: 0}
  - id: TEST-PROXMOX-002
    title: Stale capability or target configuration rejects apply
    layer: T0
    testBinding: "providers/proxmox/execution_test.go#TestProxmoxFailureWindowContract/TEST-PROXMOX-002"
    expect: {error: stale_plan, mutations: 0, claimsRetained: true}
  - id: TEST-PROXMOX-003
    title: Template digest or forbidden-device drift rejects apply
    layer: T0_T3
    testBinding: "providers/proxmox/execution_test.go#TestProxmoxFailureWindowContract/TEST-PROXMOX-003"
    credentialedBinding: "providers/proxmox/t3_failure_recovery_test.go#TestCredentialedProxmoxT3FailureRecovery"
    expect: {error: template_drift, mutations: 0}
  - id: TEST-PROXMOX-004
    title: Claimed VMID occupied by foreign VM is never adopted
    layer: T0_T3
    testBinding: "providers/proxmox/execution_test.go#TestProxmoxFailureWindowContract/TEST-PROXMOX-004"
    credentialedBinding: "providers/proxmox/t3_failure_recovery_test.go#TestCredentialedProxmoxT3FailureRecovery"
    expect: {error: ownership_mismatch, cloneCalls: 0, adopted: false, claimsRetained: true}
  - id: TEST-PROXMOX-005
    title: Lost clone response finds matching marker and resumes
    layer: T0_T3
    testBinding: "providers/proxmox/execution_test.go#TestProxmoxFailureWindowContract/TEST-PROXMOX-005"
    credentialedBinding: "providers/proxmox/t3_failure_recovery_test.go#TestCredentialedProxmoxT3FailureRecovery"
    fault: clone_response_lost_after_commit
    expect: {cloneCalls: 1, duplicateVMs: 0, resumesTaskOrConfig: true}
  - id: TEST-PROXMOX-006
    title: Lost clone response with absent VM retries same invocation
    layer: T0
    testBinding: "providers/proxmox/execution_test.go#TestProxmoxFailureWindowContract/TEST-PROXMOX-006"
    fault: clone_response_lost_before_commit
    expect: {safeRetry: true, finalCloneCount: 1}
  - id: TEST-PROXMOX-007
    title: Clone task failure before VM creation is terminal and clean
    layer: T0_T3
    testBinding: "providers/proxmox/execution_test.go#TestProxmoxFailureWindowContract/TEST-PROXMOX-007"
    credentialedBinding: "providers/proxmox/t3_failure_recovery_test.go#TestCredentialedProxmoxT3FailureRecovery"
    expect: {operationState: failed, leftovers: [], vmidClaimReleasedAfterAbsence: true}
  - id: TEST-PROXMOX-008
    title: Configuration failure compensates exactly owned VM
    layer: T0_T3
    testBinding: "providers/proxmox/execution_test.go#TestProxmoxFailureWindowContract/TEST-PROXMOX-008"
    credentialedBinding: "providers/proxmox/t3_failure_recovery_test.go#TestCredentialedProxmoxT3FailureRecovery"
    expect: {deleteCalls: 1, ownershipChecked: true, absenceConfirmed: true, leftovers: []}
  - id: TEST-PROXMOX-009
    title: Compensation delete failure reports leftover and retains claims
    layer: T0_T3
    testBinding: "providers/proxmox/execution_test.go#TestProxmoxFailureWindowContract/TEST-PROXMOX-009"
    credentialedBinding: "providers/proxmox/t3_failure_recovery_test.go#TestCredentialedProxmoxT3FailureRecovery"
    expect: {operationState: partial, leftovers: [ownedVM], claimsRetained: true}
  - id: TEST-PROXMOX-010
    title: PVE config digest race never overwrites drift
    layer: T0_T3
    testBinding: "providers/proxmox/execution_test.go#TestProxmoxFailureWindowContract/TEST-PROXMOX-010"
    credentialedBinding: "providers/proxmox/t3_failure_recovery_test.go#TestCredentialedProxmoxT3FailureRecovery"
    expect: {desiredReadbackMayComplete: true, conflictingDriftFails: true, blindOverwrite: false}
  - id: TEST-PROXMOX-011
    title: Durable journal survives restart and rejects corrupt versions
    layer: T0_T3
    testBinding: "providers/proxmox/execution_test.go#TestContractTESTPROXMOX011RestartsAtEveryPersistedMutationCheckpoint"
    credentialedBinding: "providers/proxmox/t3_failure_recovery_test.go#TestCredentialedProxmoxT3FailureRecovery"
    fault: plugin_restart_at_every_checkpoint
    expect: {sameInvocation: true, duplicateMutation: false, corruptJournalFailsClosed: true}
  - id: TEST-PROXMOX-012
    title: Lost start response reconciles task and VM state
    layer: T0_T3
    testBinding: "providers/proxmox/execution_test.go#TestProxmoxFailureWindowContract/TEST-PROXMOX-012"
    credentialedBinding: "providers/proxmox/t3_failure_recovery_test.go#TestCredentialedProxmoxT3FailureRecovery"
    expect: {startCalls: 1, finalState: running, duplicateMutation: false}
  - id: TEST-PROXMOX-013
    title: Destroy refuses ownership marker mismatch
    layer: T0_T3
    testBinding: "providers/proxmox/execution_test.go#TestProxmoxFailureWindowContract/TEST-PROXMOX-013"
    credentialedBinding: "providers/proxmox/t3_failure_recovery_test.go#TestCredentialedProxmoxT3FailureRecovery"
    expect: {error: ownership_mismatch, deleteCalls: 0, auditAlert: true, claimsRetained: true}
  - id: TEST-PROXMOX-014
    title: Lost destroy response releases claims only after absence
    layer: T0_T3
    testBinding: "providers/proxmox/execution_test.go#TestProxmoxFailureWindowContract/TEST-PROXMOX-014"
    credentialedBinding: "providers/proxmox/t3_failure_recovery_test.go#TestCredentialedProxmoxT3FailureRecovery"
    expect: {deleteCalls: 1, absenceConfirmed: true, releaseAfterConfirmation: true}
  - id: TEST-PROXMOX-015
    title: Lifecycle operations are read-before-action idempotent
    layer: T0_T3
    testBinding: "providers/proxmox/execution_test.go#TestProxmoxFailureWindowContract/TEST-PROXMOX-015"
    credentialedBinding: "providers/proxmox/t3_failure_recovery_test.go#TestCredentialedProxmoxT3FailureRecovery"
    expect: {duplicateActions: 0, forceFlags: false, pauseToDisk: false}
  - id: TEST-PROXMOX-016
    title: Credential and guest-data canaries are absent from every sink
    layer: T0
    testBinding: "providers/proxmox/execution_test.go#TestProxmoxFailureWindowContract/TEST-PROXMOX-016"
    expect: {canaryOccurrences: 0, taskLogsReturned: false, upstreamBodiesReturned: false}
  - id: TEST-PROXMOX-017
    title: Concurrent VLAN claims are unique and safely retained
    layer: T0_T3
    testBinding: "providers/proxmox/execution_test.go#TestProxmoxAllocationAndCapabilityEvidenceContract/TEST-PROXMOX-017"
    credentialedBinding: "providers/proxmox/t3_failure_recovery_test.go#TestCredentialedProxmoxT3FailureRecovery"
    expect: {duplicateClaims: 0, conflictReplans: true, orphanClaimReleased: false}
  - id: TEST-PROXMOX-018
    title: Management and cross-instance isolation are proved positively and negatively
    layer: T3
    testBinding: "providers/proxmox/execution_test.go#TestProxmoxAllocationAndCapabilityEvidenceContract/TEST-PROXMOX-018"
    credentialedBinding: "providers/proxmox/t3_isolation_test.go#TestCredentialedProxmoxT3Isolation"
    expect: {intendedSegmentReachable: true, managementReachable: false, otherInstanceReachable: false}
  - id: TEST-PROXMOX-019
    title: Missing or mis-scoped effective privilege blocks capability
    layer: T0_T3
    testBinding: "providers/proxmox/execution_test.go#TestProxmoxAllocationAndCapabilityEvidenceContract/TEST-PROXMOX-018-and-TEST-PROXMOX-019"
    credentialedBinding: "providers/proxmox/t3_failure_recovery_test.go#TestCredentialedProxmoxT3FailureRecovery"
    expect: {workloadVm: unsupported, mutations: 0, missingScopesReportedSafely: true}
  - id: TEST-PROXMOX-020
    title: Unsupported artifact mount and snapshot requests never mutate
    layer: T0
    testBinding: "providers/proxmox/planning_test.go#TestValidateRejectsUnsupportedProxmoxInputs"
    expect: {errors: [unsupported_guest_artifact, unsupported_volume, unsupported_snapshot], mutations: 0}
  - id: TEST-PROXMOX-021
    title: Malformed or mismatched UPID is rejected
    layer: T0
    testBinding: "providers/proxmox/execution_test.go#TestProxmoxFailureWindowContract/TEST-PROXMOX-021"
    expect: {error: invalid_task_identity, successInferred: false, followupMutation: false}
  - id: TEST-PROXMOX-022
    title: Task failure and oversized diagnostics stay bounded and redacted
    layer: T0_T3
    testBinding: "providers/proxmox/execution_test.go#TestProxmoxFailureWindowContract/TEST-PROXMOX-022"
    credentialedBinding: "providers/proxmox/t3_failure_recovery_test.go#TestCredentialedProxmoxT3FailureRecovery"
    expect: {error: provider_task_failed, bounded: true, canaryOccurrences: 0, rawTaskLog: false}
  - id: TEST-PROXMOX-023
    title: Core target integration binds evidence, claims, dependencies, credentials, and cleanup
    layer: T0
    testBinding: "internal/controlplane/provider_target_integration_test.go#TestContractTESTPROXMOX023ProviderTargetPlansClaimsRoutesWorkerAndReleasesAfterAbsence"
    expect: {protocolMinor: 1, capabilityPersisted: true, credentialScoped: true, conflictReplans: true, dependenciesCommitted: true, releaseAfterConfirmation: true, productionGateBypass: false}
  - id: TEST-PROXMOX-024
    title: Signed exact-target qualification evidence fails closed
    layer: T0
    testBinding: "tools/proxmox-qualification/qualification/evidence_test.go#TestContractTESTPROXMOX024SignedQualificationEvidenceFailsClosed"
    expect: {canonical: true, signed: true, exactTargetBound: true, completeT3MatrixRequired: true, isolationFailureBlocks: true, cleanupAmbiguityBlocks: true, claimsRetained: true, productionGateBypass: false}
  - id: TEST-PROXMOX-025
    title: Credentialed smoke requires exact destructive and target-specific confirmation
    layer: T0_T3
    testBinding: "providers/proxmox/t3_smoke_test.go#TestContractTESTPROXMOX025CredentialedSmokeRequiresExplicitTargetConfirmation"
    credentialedBinding: "providers/proxmox/t3_smoke_test.go#TestCredentialedProxmoxT3Smoke"
    expect: {defaultMutations: 0, partialActivationRejected: true, exactDisposableClaims: true, lifecycleRoundTrip: true, automaticOwnedCleanup: true, absenceConfirmed: true, qualifiesByItself: false, productionGateBypass: false}
  - id: TEST-PROXMOX-026
    title: Guest-origin probe protocol is closed, bounded, mutually authenticated, and redacted
    layer: T0_T3
    testBinding: "tools/proxmox-qualification/probe/protocol_test.go#TestContractTESTPROXMOX026GuestProbeProtocolIsClosedBoundedAndRedacted"
    companionBinding: "tools/proxmox-qualification/probe/client_test.go#TestProbeClientUsesPinnedTLSAndBoundedTypedResponse"
    evidenceBinding: "tools/proxmox-qualification/qualification/probe_test.go#TestContractTESTPROXMOX026ProbeTranscriptMapsToSignedEvidence"
    expect: {orderedTargets: [intended_segment, management, cross_instance], tcpConnectOnly: true, mutualTLS: true, singleFlight: true, boundedAttempts: true, rawTargetAddressesReturned: false, guestExecutionOutstanding: false, productionRole: none}
  - id: TEST-PROXMOX-027
    title: Credentialed isolation runner binds exact source peer and cross-instance topology
    layer: T0_T3
    testBinding: "providers/proxmox/t3_isolation_test.go#TestContractTESTPROXMOX027CredentialedIsolationRunnerBindsExactTopologyAndProbeInputs"
    credentialedBinding: "providers/proxmox/t3_isolation_test.go#TestCredentialedProxmoxT3Isolation"
    expect: {defaultMutations: 0, exactInputPaths: 6, sourceGuests: 2, crossInstanceGuests: 1, distinctVMIDs: 3, distinctVLANs: 2, guestProbeBound: true, reverseCleanup: true, vmAbsenceRechecked: true, qualifiesByItself: false, productionGateBypass: false}
  - id: TEST-PROXMOX-028
