formatVersion: 1
suite: labcentral.production-topology/v1alpha1
status: kubernetes_and_native_bases_implemented_resilience_gates_open
cases:
  - id: TEST-PROD-TOPOLOGY-001
    title: Kubernetes base is closed until deployment-specific inputs replace every placeholder
    binding: tools/verify_phase0.py#verify_kubernetes_topology
    expect: {taggedImages: false, exampleSecretsApplied: false, exampleConfigApplied: false, placeholderEgressAllowed: false}
  - id: TEST-PROD-TOPOLOGY-002
    title: Replicas have stable identities and disruption-aware placement
    binding: tools/verify_phase0.py#verify_kubernetes_topology
    expect: {replicas: 2, stableReplicaIdentity: true, requiredNodeAntiAffinity: true, minimumAvailable: 1}
  - id: TEST-PROD-TOPOLOGY-003
    title: Core and official plugins run as distinct restricted identities
    binding: tools/verify_phase0.py#verify_kubernetes_topology
    expect: {distinctUIDs: true, readOnlyRoots: true, privilegeEscalation: false, capabilitiesDropped: all, serviceAccountTokenMounted: false}
  - id: TEST-PROD-TOPOLOGY-004
    title: Sidecar IPC uses bounded group-only sockets and rollout tokens
    binding: internal/pluginhost/host_test.go#TestAttachUsesGroupRestrictedIPCAndProtectedTokenFile
    startupOrderBinding: internal/pluginhost/host_test.go#TestAttachAcceptsPluginStartedBeforeRegistrationSocket
    healthBinding: cmd/labd/main_test.go#TestAttachedPluginMonitorRequiresConsecutiveFailures
    expect: {runtimeDirectoryMode: "0770", socketMode: "0660", tokenBytes: 32, directTokenEnvironment: false, crossPluginTokenMount: false}
  - id: TEST-PROD-TOPOLOGY-005
    title: Shared storage and Proxmox mutation journal have separate identities and process-safe coordination
    binding: cmd/labd/main_test.go#TestMultiReplicaProxmoxJournalMustUseSharedArtifactFilesystem
    processBinding: providers/proxmox/journal_test.go#TestInvocationJournalLeaseSerializesProviderProcesses
    expect: {artifactMode: shared-filesystem, journalIsArtifactSibling: true, journalOwner: proxmox-provider, lockScope: completeMutationRPC}
  - id: TEST-PROD-TOPOLOGY-006
    title: Network policy defaults to deny and names every required production egress class
    binding: tools/verify_phase0.py#verify_kubernetes_topology
    expect: {defaultDenyIngress: true, defaultDenyEgress: true, dns: explicit, postgresql: explicit, proxmox: explicit, oidc: explicit}
  - id: TEST-PROD-TOPOLOGY-007
    title: Native core, provider, and access services use separate operating-system identities and private credential projections
    binding: tools/verify_phase0.py#verify_native_topology
    processBinding: internal/pluginhost/host_test.go#TestAttachUsesGroupRestrictedIPCAndProtectedTokenFile
    expect: {distinctUsers: true, separateIPCGroupPerPlugin: true, systemdCredentials: true, directTokenEnvironment: false, hostLossTerminatesPlugin: true}
  - id: TEST-PROD-TOPOLOGY-008
    title: Native services start behind fail-closed network policy and cannot traverse each other's private state
    binding: tools/verify_phase0.py#verify_native_topology
    expect: {defaultNetworkDeny: true, loopbackOnlyUntilOperatorAllowlist: true, providerJournalOwner: labcentral-proxmox, crossStateAccess: false, systemCallAllowlist: true}
