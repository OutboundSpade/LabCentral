formatVersion: 1
suite: labcentral.production-release/v1alpha1
status: protected_publisher_implemented_repository_controls_and_live_ceremony_open
publisher:
  repository: OutboundSpade/LabCentral
  workflow: .github/workflows/publisher-release.yml
  environment: publisher-release
  runner: github-hosted
  oidcIssuer: https://token.actions.githubusercontent.com
  certificateIdentityPrefix: https://github.com/OutboundSpade/LabCentral/.github/workflows/publisher-release.yml@refs/tags/
  releaseRefPattern: vMAJOR.MINOR.PATCH
artifacts:
  native: [archive, archiveChecksum, sigstoreBundle, githubProvenance]
  container: [digestQualifiedImage, sigstoreSignature, githubProvenance]
cases:
  - id: TEST-PROD-RELEASE-001
    title: Runtime API reports the build-linked release version
    goTests: [TestBootstrapAndStaticAssetsCarrySecurityWarnings]
    expect: {developmentDefault: dev, publisherValue: tag, hardcodedProductVersion: false}
  - id: TEST-PROD-RELEASE-002
    title: Normal CI is read-only and pins every third-party action by full commit
    evidence: workflow_static_verifier
    expect: {tokenPermissions: contents_read_only, mutableActionTags: 0, postgresql18Gate: true, normalAndRace: true, vulnerabilityScan: true}
  - id: TEST-PROD-RELEASE-003
    title: Publisher accepts only an exact SemVer tag commit reachable from main behind a protected environment
    evidence: workflow_static_verifier
    expect: {repositoryBound: true, environment: publisher-release, exactTagCommit: true, mainAncestor: true, dirtyTreeRefused: true}
  - id: TEST-PROD-RELEASE-004
    title: Native archive is rebuilt independently and byte-compared before publication
    evidence: workflow_static_verifier
    expect: {builds: 2, archiveByteComparison: true, externalChecksumVerified: true, internalChecksumsVerified: true}
  - id: TEST-PROD-RELEASE-005
    title: Native archive and image digest receive keyless signatures with exact-identity same-run verification
    evidence: workflow_static_verifier
    expect: {oidcIssuerExact: true, workflowIdentityExact: true, archiveSigned: true, imageDigestSigned: true, verificationBeforePublish: true}
  - id: TEST-PROD-RELEASE-006
    title: GitHub provenance binds the native archive and pushed image digest
    evidence: workflow_static_verifier
    expect: {archiveAttestation: true, imageAttestation: true, imageAttestationPushedToRegistry: true}
  - id: TEST-PROD-RELEASE-007
    title: Compatibility and operator verification guidance ship inside the native archive
    evidence: release_builder_static_verifier
    expect: {compatibilityMatrix: true, exactIdentityVerification: true, upgradeRollbackBoundary: true}
