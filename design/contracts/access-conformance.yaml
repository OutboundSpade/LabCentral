formatVersion: 1
suite: labcentral.access-contract/v1alpha1
clock: database
states: [pending, ready, active, expired, revoked, failed]
defaults:
  launchTTL: 5m
  authorizationLease: 15s
  authorizationOutageLimit: 30s
  oneTimeLaunchTokenBytes: 32
requiredAccessFeature: access-authorization-recheck-v1
cases:
  - id: TEST-ACCESS-001
    title: Cross-tenant or unowned access is denied before plugin calls
    goTest: TestAccessContract001UnauthorizedRequestStopsBeforePlugins
    setup: {subjectRelationship: none, requestedInstanceOwner: another-tenant}
    expect: {error: not_found_or_denied, providerCalls: 0, accessPluginCalls: 0}
  - id: TEST-ACCESS-002
    title: Endpoint handoff is bound to the exact resource method and state
    goTest: TestAccessContract002ExactEndpointBinding
    setup:
      request: {instanceID: instance-a, resourceID: vm-a, method: vnc}
      endpoint: {instanceID: instance-a, resourceID: vm-a, method: vnc, providerStateDigest: state-a}
    expect: {accepted: true, substitutedBindingAccepted: false}
  - id: TEST-ACCESS-003
    title: Session lifetime is the tightest applicable validity bound
    goTest: TestAccessContract003TightestExpiryWins
    setup: {policyValidFor: 30m, endpointValidFor: 2m, launchValidFor: 5m}
    expect: {sessionValidFor: 2m, launchValidForAtMost: 2m, databaseTimeUsed: true}
  - id: TEST-ACCESS-004
    title: Concurrent one-time exchange has exactly one winner
    goTest: TestAccessContract004ConcurrentExchangeHasOneWinner
    postgresqlGoTest: TestPostgreSQLAccessConformance
    setup: {replicas: 8, sameLaunchToken: true}
    expect: {successfulExchanges: 1, reusableLaunchTokens: 0}
  - id: TEST-ACCESS-005
    title: Audience plugin and session mismatch blocks exchange
    goTest: TestAccessContract005AudienceAndPluginBinding
    substitutions: [audience, pluginInstanceID, accessSessionID]
    expect: {allDenied: true, activeConnections: 0}
  - id: TEST-ACCESS-006
    title: Exchange rechecks current authorization and ownership
    goTest: TestAccessContract006ExchangeReauthorizes
    changesBeforeExchange: [userDisabled, membershipEnded, roleRevoked, targetGrantRevoked, ownerChanged, instanceDestroying]
    expect: {allDenied: true, tokenConsumedWithoutConnection: true}
  - id: TEST-ACCESS-007
    title: Active authorization leases close after permission loss
    goTest: TestAccessContract007ActiveLeaseReauthorization
    changesWhileActive: [userDisabled, membershipEnded, roleRevoked, targetGrantRevoked, ownerChanged, instanceDestroying]
    expect: {nextRecheckDenied: true, connectionClosed: true, maximumDelay: 15s}
  - id: TEST-ACCESS-008
    title: Core outage fails active access closed
    goTest: TestAccessContract008AuthorizationOutageFailsClosed
    setup: {coreUnreachableAfterExchange: true}
    expect: {newConnectionsDenied: true, activeConnectionClosedWithin: 30s}
  - id: TEST-ACCESS-009
    title: Revocation commits core denial before plugin closure
    goTest: TestAccessContract009RevocationIsCoreFirst
    setup: {accessPluginReachable: false, connectionState: active}
    expect: {coreState: revoked, newExchangeDenied: true, recheckDenied: true, closureRetryRetained: true}
  - id: TEST-ACCESS-010
    title: Plugin revocation is idempotent and closes active streams
    goTest: TestAccessContract010IdempotentPluginRevocation
    calls: [revoke, revoke]
    expect: {activeConnectionsClosed: true, terminalState: revoked, errors: 0}
  - id: TEST-ACCESS-011
    title: Lost CreateAccess response cannot create two usable launches
    goTest: TestAccessContract011LostCreateResponseRecovery
    fault: response_lost_after_plugin_accept
    recovery: retry_same_access_session_and_idempotency_key
    expect: {readySessions: 1, usableLaunchTokens: 1, supersededTokensAccepted: false}
  - id: TEST-ACCESS-012
    title: Plugin restart cannot revive expired revoked or consumed tokens
    goTest: TestAccessContract012RestartPreservesDenial
    restartStates: [expired, revoked, launch-token-consumed]
    expect: {revivedSessions: 0, revivedTokens: 0, preRestartConnectionsClosed: true}
  - id: TEST-ACCESS-013
    title: Access protocol downgrade and schema mismatch fail closed
    goTest: TestAccessContract013ProtocolAndSchemaCompatibility
    mismatches: [missing-recheck-feature, endpoint-major, access-state-major, unsupported-method]
    expect: {sessionsCreated: 0, endpointsOpened: 0, error: protocol_feature_unavailable}
  - id: TEST-ACCESS-014
    title: Credentials endpoint data and tokens are absent from durable and telemetry sinks
    goTest: TestAccessContract014SensitiveCanariesAbsent
    securityTest: TEST-SEC-ACCESS-002
    injectThrough: [providerCredential, sshCAKey, endpointEnvelope, launchToken, authorizationLease]
    scanSinks: [databasePlaintext, logs, errors, events, audit, traces, metrics]
    expect: {canaryOccurrences: 0}
  - id: TEST-ACCESS-015
    title: Browser launch never places a token in a URL or referrer
    goTest: TestAccessContract015NoURLToken
    securityTest: TEST-SEC-ACCESS-001
    expect: {queryToken: absent, fragmentToken: absent, referrerPolicy: no-referrer, oneTimeExchange: true}
  - id: TEST-ACCESS-016
    title: Proxmox noVNC discovery uses only qualified exact-target console APIs
    goTest: TestAccessContract016ProxmoxNoVNCExactTarget
    setup: {transport: verified-https, endpointSchema: proxmox.novnc-endpoint/v1.0}
    expect:
      exactTargetAndResource: true
      approvedConsoleAPIsOnly: true
      requiredPrivilegeEvidenceFresh: true
      managementOriginReturnedToBrowser: false
      providerCredentialReturnedToAccessPlugin: false
      rawProviderErrorsReturned: false
  - id: TEST-ACCESS-017
    title: SSH is unavailable without a trusted session-certificate path
    goTest: TestAccessContract017SSHRequiresTrustedUserCA
    setup: {imageTrustsConfiguredUserCA: false}
    expect: {capability: unsupported, sshConnectionAttempts: 0, reusableCredentialIssued: false}
  - id: TEST-ACCESS-018
    title: Disposable target proves launch isolation revocation and management-origin secrecy
    protectedGoTest: TestProxmoxAccessSessionQualification
    defaultBehavior: skipped_before_file_or_network_access
    expect:
      browserSSHWhenQualified: succeeds
      browserNoVNC: succeeds
      crossTenantLaunch: denied
      activeRevocationCloses: true
      managementOriginExposed: false
      sensitiveCanaryOccurrences: 0
