formatVersion: 1
decisions: [ADR-0015, ADR-0016, ADR-0017]
task: TASK-ARCH-002
cases:
  - id: TEST-ARCH-001
    contract: Orchestration has no wire imports; domain/application remain inward and public SDK has no core internals.
    file: internal/architecture/imports_test.go
    test: TestOrchestrationAndPersistenceDependOnApplication
  - id: TEST-ARCH-002
    contract: An independent module installs two targets through manifests without core provider registration code.
    file: cmd/labd/installation_test.go
    test: TestExternalModuleInstallsTwoTargetsWithoutCoreRegistration
  - id: TEST-ARCH-003
    contract: A failed local plugin restarts behind the existing RPC client.
    file: internal/pluginhost/host_test.go
    test: TestSupervisorRestartsOnePluginAndKeepsStableClient
  - id: TEST-ARCH-004
    contract: Required-input revisions publish without values; supplied values bind resolved identity and idempotency.
    file: internal/controlplane/templates_test.go
    test: TestParameterizedRevisionInputIdentityAndSemantics
  - id: TEST-ARCH-005
    contract: Unknown renderer semantics never silently invoke the current renderer.
    file: internal/render/template_test.go
    test: TestRequiredParametersArePublishedBeforeResolution
  - id: TEST-ARCH-006
    contract: Cleanup grants bind current active trust and exact resource/build/ownership with a maximum 24-hour lifetime.
    file: tools/proxmox-qualification/qualification/cleanup_test.go
    test: TestCleanupGrantIsExactCurrentAndIndependentlyTrusted
  - id: TEST-ARCH-007
    contract: Cleanup authority cannot authorize apply and still traverses owned VM deletion.
    file: providers/proxmox/execution_test.go
    test: TestCleanupFallbackOnlyDeletesPreviouslyOwnedResource
  - id: TEST-ARCH-008
    contract: Documentation changes do not change selected provider source identity; provider input changes do.
    file: tools/internal/sourceidentity/digest_test.go
    test: TestDigestChangesOnlyForSelectedInputs
  - id: TEST-ARCH-009
    contract: Missing, duplicate or lost terminal results remain errors rather than successful mutation evidence.
    file: internal/adapter/providergrpc/provider_test.go
    test: TestMutationStreamRequiresExactlyOneTerminalResult
  - id: TEST-ARCH-010
    contract: A down provider does not enter the claim filter; recovery admits it again.
    file: internal/controlplane/worker_test.go
    test: TestWorkerClaimsOnlyAvailableTargets
  - id: TEST-ARCH-011
    contract: Filtered claims preserve unavailable instances and claim the available instance, on SQLite and PostgreSQL.
    file: internal/adapter/jobsdb/conformance_test.go
    test: TestClaimFilterLeavesUnavailableInstanceQueued
