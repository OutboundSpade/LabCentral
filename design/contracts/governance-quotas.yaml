formatVersion: 1
suite: labcentral.governance-quotas/v1alpha1
cases:
  - id: TEST-GOV-QUOTA-001
    title: Scoped hard quotas compose at admission
    goTest: TestSQLiteQuotaExpirationConformance
    postgresqlGoTest: TestPostgreSQLQuotaExpirationConformance
    expect: {transaction: serializable, tightestApplicableLimitWins: true, overLimitLeavesNoInstance: true}
  - id: TEST-GOV-QUOTA-002
    title: Installing a scoped quota backfills live usage
    goTest: TestSQLiteQuotaExpirationConformance
    postgresqlGoTest: TestPostgreSQLQuotaExpirationConformance
    expect: {existingReservationsCounted: true, falseZeroBaseline: false, belowCurrentUsageRejected: true}
  - id: TEST-GOV-QUOTA-003
    title: Lifetime policy is resolved from database time
    goTest: TestSQLiteQuotaExpirationConformance
    postgresqlGoTest: TestPostgreSQLQuotaExpirationConformance
    expect: {defaultTTLApplied: true, maximumTTLApplied: true, workerClockAuthoritative: false}
  - id: TEST-GOV-QUOTA-004
    title: TTL renewal is conditional and replay exact
    goTest: TestNoAuthQuotaAndLifetimeHTTPResourceLifecycle
    expect: {ifMatchRequired: true, idempotencyRequired: true, originalMutationSnapshotReplayed: true}
  - id: TEST-GOV-QUOTA-005
    title: TTL renewal rechecks authority in its write transaction
    goTest: TestSQLiteQuotaExpirationConformance
    postgresqlGoTest: TestPostgreSQLQuotaExpirationConformance
    expect: {roleMembershipOwnerAndTargetGrantRechecked: true, concurrentRevocationFailsClosed: true}
  - id: TEST-GOV-QUOTA-006
    title: Warning and expiration scheduling are race safe
    goTest: TestSQLiteQuotaExpirationConformance
    postgresqlGoTest: TestPostgreSQLQuotaExpirationConformance
    expect: {warningOneShot: true, exactExpiryPredicate: true, destroyDeduplicated: true}
  - id: TEST-GOV-QUOTA-007
    title: Invocation-free expiry releases quota and allocation claims
    goTest: TestWorkerReleasesPlannedClaimsWhenLifetimeExpiresBeforeProviderWork
    expect: {providerCalls: 0, quotaReleased: true, allocationClaimsReleased: true}
  - id: TEST-GOV-QUOTA-008
    title: Expired running lease races safely with worker reclaim
    goTest: TestSQLiteQuotaExpirationConformance
    postgresqlGoTest: TestPostgreSQLQuotaExpirationConformance
    expect: {winners: 1, invocationRequiredBeforeRetention: true, eventualTerminalization: true}
  - id: TEST-GOV-QUOTA-009
    title: Unknown provider result is recovered without redispatch
    goTest: TestWorkerRecoversUnknownInvocationWithoutRedispatch
    expect: {nextAction: get_invocation, duplicateMutation: false, claimsRetainedUntilKnown: true}
  - id: TEST-GOV-QUOTA-010
    title: Pre-quota databases backfill live and uncertain instances
    goTest: TestSQLiteLegacyQuotaUpgradeConformance
    postgresqlGoTest: TestPostgreSQLLegacyQuotaUpgradeConformance
    expect: {readyUsage: committed, uncertainUsage: retained, rerunIdempotent: true}
  - id: TEST-GOV-QUOTA-011
    title: Governance HTTP binding and authorization are closed
    goTest: TestAuthenticatedQuotaAndTTLDenialsPrecedeGovernanceStore
    expect: {scopeAuthorizationBeforeStore: true, malformedScopeRejected: true, dynamicUsageCacheable: false}
