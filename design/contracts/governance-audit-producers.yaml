formatVersion: 1
suite: labcentral.governance-audit-producers/v1alpha1
cases:
  - id: TEST-AUDIT-001
    title: Authentication lifecycle mutations emit redacted atomic records
    goTest: TestSQLiteIdentityRBACAndSessionConformance
    postgresqlGoTest: TestPostgreSQLIdentityRBACAndSessionConformance
    expect: {category: authentication, atomicWithSession: true, credentialValuesPresent: false}
  - id: TEST-AUDIT-002
    title: Allowed and denied authorization decisions are recorded
    goTest: TestSQLiteIdentityRBACAndSessionConformance
    postgresqlGoTest: TestPostgreSQLIdentityRBACAndSessionConformance
    expect: {category: authorization, allowedRecorded: true, deniedRecorded: true, hiddenScopeDisclosure: false}
  - id: TEST-AUDIT-003
    title: Target snapshot and governance records commit or roll back together
    goTest: TestSQLiteIdentityRBACAndSessionConformance
    postgresqlGoTest: TestPostgreSQLIdentityRBACAndSessionConformance
    expect: {category: target, atomicSnapshot: true, discoveryStoredAsDigestOnlyInRecord: true}
  - id: TEST-AUDIT-004
    title: Template mutations use immutable aggregate records
    goTest: TestSQLiteTemplateGovernancePersistence
    postgresqlGoTest: TestPostgreSQLTemplateGovernancePersistence
    expect: {category: template, createUpdatePublishCovered: true, atomicOutbox: true}
  - id: TEST-AUDIT-005
    title: Operation queue and terminal transitions use generalized records
    goTest: TestExampleAApplyAndDestroyThroughDurableWorker
    postgresqlGoTest: TestPostgreSQLControlPlaneStoreConformance
    expect: {category: operation, queueAtomic: true, terminalAtomic: true}
  - id: TEST-AUDIT-006
    title: Access lifecycle records exclude endpoint token and opaque state
    goTest: TestSQLiteAccessSessionConformance
    postgresqlGoTest: TestPostgreSQLAccessSessionConformance
    expect: {category: access, endpointValuesPresent: false, tokenValuesPresent: false, opaqueStatePresent: false}
  - id: TEST-AUDIT-007
    title: Administrator mutations identify the request actor and scope
    goTest: TestSQLiteIdentityRBACAndSessionConformance
    postgresqlGoTest: TestPostgreSQLIdentityRBACAndSessionConformance
    expect: {category: administrator, actorBoundFromContext: true, scopeBound: true}
  - id: TEST-AUDIT-008
    title: Audit and event views append atomically
    goTest: TestSQLiteAuditEventStore
    postgresqlGoTest: TestPostgreSQLAuditEventStore
    expect: {duplicateEventRollsBackAudit: true, outboxAtomicWithEvent: true}
  - id: TEST-AUDIT-009
    title: Audit payload validator rejects secret-bearing structures
    goTest: TestAuditPayloadRejectsSecretKeysAndMalformedJSON
    expect: {passwordRejected: true, tokenRejected: true, credentialRejected: true, duplicateKeysRejected: true}
  - id: TEST-AUDIT-010
    title: Export and retention remain bounded and outbox aware
    goTest: TestSQLiteAuditEventStore
    postgresqlGoTest: TestPostgreSQLAuditEventStore
    expect: {boundedNDJSON: true, boundedDeleteBatch: true, pendingOutboxPreserved: true}
