formatVersion: 1
suite: labcentral.security-controls/v1alpha1
threats:
  - id: THREAT-NET-001
    title: Guest reaches control plane or provider management API
    owners: [core, provider, deployment, operator]
    controls: [CTRL-NET-DEFAULT-DENY, CTRL-NET-MANAGEMENT-DENY, CTRL-NET-SEPARATE-MANAGEMENT]
    tests: [TEST-RENDER-006, TEST-PROVIDER-011, TEST-PROXMOX-018, TEST-SEC-NET-001]
  - id: THREAT-TENANT-001
    title: Cross-tenant enumeration, access, or traffic
    owners: [core, provider, deployment]
    controls: [CTRL-AUTHZ-DEFAULT-DENY, CTRL-AUTHZ-LIST-FILTER, CTRL-NET-TENANT-SEGMENT]
    tests: [TEST-SEC-TENANT-001, TEST-SEC-TENANT-002]
  - id: THREAT-ISOLATION-001
    title: Container or guest isolation escape
    owners: [core, provider, deployment, operator]
    controls: [CTRL-ISOLATION-EXPLICIT, CTRL-ISOLATION-NO-DOWNGRADE, CTRL-RUNTIME-PATCH]
    tests: [TEST-PROVIDER-011, TEST-SEC-ISOLATION-001]
  - id: THREAT-IMPORT-001
    title: SSRF or malicious external image import
    owners: [core, deployment, operator]
    controls: [CTRL-IMPORT-DISABLED-DEFAULT, CTRL-IMPORT-ALLOWLIST-DIGEST, CTRL-IMPORT-ISOLATED-FETCHER]
    tests: [TEST-SEC-IMPORT-001, TEST-SEC-IMPORT-002]
  - id: THREAT-BUNDLE-001
    title: Path traversal, link attack, or archive bomb
    owners: [core, deployment]
    controls: [CTRL-BUNDLE-NORMALIZE, CTRL-BUNDLE-REJECT-LINKS, CTRL-BUNDLE-LIMITS, CTRL-BUNDLE-QUARANTINE]
    tests: [TEST-PARSER-001, TEST-SEC-BUNDLE-001, TEST-SEC-BUNDLE-002]
  - id: THREAT-RENDER-001
    title: Malicious YAML or expression-engine abuse
    owners: [core]
    controls: [CTRL-YAML-STRICT, CTRL-CEL-BOUNDED, CTRL-EXPANSION-LIMIT]
    tests: [TEST-PARSER-001, TEST-RENDER-003, TEST-RENDER-004, TEST-RENDER-008]
  - id: THREAT-BUILD-001
    title: Container build context executes with control-plane privilege
    owners: [core, deployment]
    controls: [CTRL-BUILD-SEPARATE-JOB, CTRL-BUILD-NO-CREDENTIALS, CTRL-BUILD-SANDBOX]
    tests: [TEST-SEC-BUILD-001]
  - id: THREAT-PLUGIN-001
    title: Malicious plugin steals credentials or corrupts state
    owners: [core, deployment, operator]
    controls: [CTRL-PLUGIN-PROCESS-ISOLATION, CTRL-PLUGIN-DIGEST, CTRL-PLUGIN-SCOPED-CREDENTIAL, CTRL-PLUGIN-RESPONSE-VALIDATION]
    tests: [TEST-PLUGIN-IDENTITY-001, TEST-PLUGIN-TOKEN-001, TEST-PROVIDER-014, TEST-PROXMOX-011, TEST-PROXMOX-016]
  - id: THREAT-OWNERSHIP-001
    title: Provider tag spoof causes adoption or destructive cleanup
    owners: [core, provider, operator]
    controls: [CTRL-OWNERSHIP-ID-AND-TOKEN, CTRL-OWNERSHIP-NO-NAME-DELETE, CTRL-OWNERSHIP-AUDIT-ALERT]
    tests: [TEST-PROVIDER-003, TEST-PROVIDER-018, TEST-PROXMOX-004, TEST-PROXMOX-013, TEST-ALLOC-006, TEST-ALLOC-007]
  - id: THREAT-ACCESS-001
    title: Browser console or tunnel token leaks
    owners: [core, accessPlugin, deployment]
    controls: [CTRL-ACCESS-ONE-TIME, CTRL-ACCESS-AUDIENCE, CTRL-ACCESS-NO-REFERRER, CTRL-ACCESS-REDACTION]
    tests: [TEST-SEC-ACCESS-001, TEST-SEC-ACCESS-002]
  - id: THREAT-SESSION-001
    title: CSRF, session theft, or OIDC callback abuse
    owners: [core, deployment]
    controls: [CTRL-SESSION-COOKIE, CTRL-SESSION-CSRF, CTRL-OIDC-STATE-NONCE-PKCE, CTRL-PROXY-TRUST]
    tests: [TEST-SEC-SESSION-001, TEST-SEC-OIDC-001]
  - id: THREAT-SECRET-001
    title: Secret value leaks into durable or telemetry sinks
    owners: [core, provider, accessPlugin, deployment]
    controls: [CTRL-SECRET-REF-ONLY, CTRL-SECRET-JIT, CTRL-SECRET-TAINT-REDACTION]
    tests: [TEST-SCHEMA-INVALID-004, TEST-RENDER-003, TEST-PROVIDER-014, TEST-PROXMOX-016]
  - id: THREAT-DELETE-001
    title: Replay, race, or stale worker performs destructive action
    owners: [core, provider]
    controls: [CTRL-DELETE-ETAG-GENERATION, CTRL-JOB-FENCING, CTRL-IDEMPOTENCY, CTRL-OWNERSHIP-ID-AND-TOKEN]
    tests: [TEST-JOB-002, TEST-JOB-004, TEST-JOB-006, TEST-PROVIDER-002, TEST-PROVIDER-018, TEST-PROXMOX-009, TEST-PROXMOX-013, TEST-PROXMOX-014, TEST-ALLOC-008, TEST-ALLOC-012, TEST-ALLOC-014]
  - id: THREAT-SUPPLY-001
    title: Compromised dependency, build, bundle, or plugin artifact
    owners: [core, deployment, operator]
    controls: [CTRL-SUPPLY-PIN, CTRL-SUPPLY-SBOM-PROVENANCE, CTRL-PLUGIN-DIGEST]
    tests: [TEST-SEC-SUPPLY-001, TEST-PLUGIN-IDENTITY-001]
testDefinitions:
  - {id: TEST-SEC-NET-001, layer: providerIntegration, assertion: management endpoints are unreachable from hostile guest networks}
  - {id: TEST-SEC-TENANT-001, layer: authorization, assertion: cross-tenant object IDs return non-disclosing denial}
  - {id: TEST-SEC-TENANT-002, layer: providerIntegration, assertion: tenant segments cannot exchange traffic}
  - {id: TEST-SEC-ISOLATION-001, layer: planning, assertion: requested VM isolation never plans a Pod or Docker container}
  - {id: TEST-SEC-IMPORT-001, layer: unit, assertion: private and metadata addresses are denied before and after DNS resolution}
  - {id: TEST-SEC-IMPORT-002, layer: integration, assertion: redirects cannot escape the allowlist or digest policy}
  - {id: TEST-SEC-BUNDLE-001, layer: fuzz, assertion: traversal links devices and case-fold collisions are rejected}
  - {id: TEST-SEC-BUNDLE-002, layer: integration, assertion: file byte depth count and decompression limits abort atomically}
  - {id: TEST-SEC-BUILD-001, layer: integration, assertion: builder has no provider credentials and restricted network/resource budget}
  - {id: TEST-SEC-ACCESS-001, layer: integration, assertion: launch token is single-use audience-bound and expires}
  - {id: TEST-SEC-ACCESS-002, layer: telemetry, assertion: URLs tokens and endpoint data are absent from logs events traces and referrers}
  - {id: TEST-SEC-SESSION-001, layer: http, assertion: mutation rejects missing or invalid CSRF and untrusted Origin}
  - {id: TEST-SEC-OIDC-001, layer: http, assertion: state nonce PKCE issuer audience and redirect are all verified}
  - {id: TEST-SEC-SUPPLY-001, layer: release, assertion: release provenance SBOM and configured checksums verify before execution}
