formatVersion: 1
suite: labcentral.production-resilience/v1alpha1
status: postgresql_100_instance_control_plane_rehearsed_live_target_chaos_open
objectives:
  classroomSize: 100
  workerReplicas: 4
  admissionToReadyMaximumSeconds: 120
  destroyMaximumSeconds: 120
cases:
  - id: TEST-PROD-RESILIENCE-001
    title: Provider mutation identities are stable per desired generation and isolated per Instance and resource
    goTests: [TestProviderInvocationDigestIsStableAndInstanceScoped]
    expect: {crossInstanceKeyReuse: false, crossResourceKeyReuse: false, takeoverKeyStable: true, legacyPreparedInvocationReadable: true}
  - id: TEST-PROD-RESILIENCE-002
    title: Migration-created production quota limits remain administratively adjustable
    goTests: [TestSQLiteQuotaExpirationConformance, TestPostgreSQLQuotaExpirationConformance]
    expect: {lazyZeroUsageLedger: true, optimisticVersion: true, quotaBypass: false, dialectParity: true}
  - id: TEST-PROD-RESILIENCE-003
    title: Four PostgreSQL workers converge a 100-Instance classroom after one claimed job is abandoned
    goTests: [TestPostgreSQLHundredInstanceMultiReplicaResilience]
    integrationGate: isolated PostgreSQL schema plus in-process protocol provider
    expect: {instancesReady: 100, abandonedClaimRecovered: true, fencingAdvanced: true, failedOperations: 0, objectiveSeconds: 120}
  - id: TEST-PROD-RESILIENCE-004
    title: Full classroom teardown retains owner isolation and leaves no active work, quota, claim, or provider object
    goTests: [TestPostgreSQLHundredInstanceMultiReplicaResilience, TestSQLiteIdentityRBACAndSessionConformance, TestPostgreSQLIdentityRBACAndSessionConformance]
    expect: {ownerBindingsCrossed: 0, uniqueProviderOwnershipTokens: 400, providerObjectsAfterDestroy: 0, activeQuotaAfterDestroy: 0, cleanupLeftovers: 0}
  - id: TEST-PROD-RESILIENCE-005
    title: Scale telemetry and adjacent security sinks remain aggregate-only and secret-free
    goTests: [TestOperationalMetricsExposeOnlyClosedAggregateDimensions, TestHTTPTraceOmitsPathQueryAndIdentifiers, TestProviderContract014SecretCanaryAbsent]
    expect: {tenantMetricLabels: false, rawObjectTraceAttributes: false, secretCanaryInProviderSink: false}
