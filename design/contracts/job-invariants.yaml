formatVersion: 1
suite: labcentral.jobs/v1alpha1
invariants:
  - id: TEST-JOB-001
    title: State change and outbox are atomic
    transaction: [updateAggregate, insertAuditIntent, insertOutbox]
    faultPoints: [beforeCommit, duringCommit]
    expect: all_or_none
  - id: TEST-JOB-002
    title: Expired lease is fenced
    oldWorker: {fencingToken: 7}
    newWorker: {fencingToken: 8}
    expect: {oldWorkerCommit: rejected, newWorkerCommit: allowed}
  - id: TEST-JOB-003
    title: Unknown invocation is queried before retry
    setup: {leaseExpired: true, invocationTerminalState: unknown}
    expect: {nextAction: get_invocation, redispatchAllowed: false}
  - id: TEST-JOB-004
    title: Idempotency key binds request digest
    first: {key: same, digest: a}
    second: {key: same, digest: b}
    expect: {secondError: idempotency_conflict}
  - id: TEST-JOB-005
    title: Quota reservation survives unknown outcome
    setup: {providerOutcome: unknown, reservation: active}
    expect: {releaseAllowed: false, reconciliationRequired: true}
  - id: TEST-JOB-006
    title: Destroy cannot succeed with leftovers
    setup: {knownOwnedLeftovers: [disk-456]}
    expect: {operationState: partial, instancePhase: degraded}
  - id: TEST-JOB-007
    title: SQLite single-writer and PostgreSQL claims share semantics
    adapters: [sqlite, postgresql]
    concurrentClaims: 8
    expect: {winnersPerJob: 1, monotonicFencing: true}
  - id: TEST-JOB-008
    title: Outbox delivery is at least once and deduplicable
    fault: crash_after_sink_accept_before_delivery_ack
    expect: {deliveryAttempts: 2, eventIDStable: true, aggregateSequenceStable: true}

