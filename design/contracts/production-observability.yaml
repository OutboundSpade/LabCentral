formatVersion: 1
suite: labcentral.production-observability/v1alpha1
cases:
  - id: TEST-PROD-OBS-001
    title: Liveness and dependency-backed readiness are distinct
    goTest: TestHealthSeparatesLivenessAndReadiness
    expect: {livenessIsProcessOnly: true, readinessChecksStartupDatabaseArtifactsAndPlugins: true, internalErrorsExposed: false}
  - id: TEST-PROD-OBS-002
    title: Readiness dependencies share one bounded deadline
    goTest: TestReadinessChecksRunWithinOneSharedDeadline
    expect: {parallelChecks: true, deadlineSeconds: 2, deterministicFailedCheckNames: true}
  - id: TEST-PROD-OBS-003
    title: Prometheus labels exclude unbounded and sensitive values
    goTest: TestMetricsAndHTTPInstrumentationUseOnlyBoundedLabels
    expect: {tenantLabels: false, resourceLabels: false, queryLabels: false, tokenLabels: false}
  - id: TEST-PROD-OBS-004
    title: Background and plugin metrics expose bounded operational state
    goTest: TestBackgroundAndPluginMetricsAreBounded
    expect: {backgroundOutcome: true, pluginCategoryAndKind: true, errorTextExposed: false}
  - id: TEST-PROD-OBS-005
    title: HTTP instrumentation preserves streaming response capabilities
    goTest: TestHTTPInstrumentationPreservesFlushing
    expect: {sseFlushPreserved: true, websocketCompatibleWriter: true}
  - id: TEST-PROD-OBS-006
    title: OTLP server spans omit paths, queries, and object identities
    goTest: TestHTTPTraceOmitsPathQueryAndIdentifiers
    expect: {w3cTraceContext: true, endpointFamilyOnly: true, rawPathPresent: false, queryPresent: false}
  - id: TEST-PROD-OBS-007
    title: Trace transport configuration fails closed
    goTest: TestObservabilityConfigurationFailsClosed
    expect: {remoteTLSRequired: true, loopbackPlaintextAllowed: true, mtlsPairRequired: true, endpointUserInfoForbidden: true}
  - id: TEST-PROD-PKG-001
    title: Scratch image starts and restarts with a clean private named volume
    integrationGate: docker compose clean-volume start, healthcheck, restart, healthcheck
    expect: {stateRootMode: "0700", readinessEndpoint: /ready, layoutPreserved: true, disposableVolumeRemoved: true}
