apiVersion: labs.labcentral.io/v1alpha1
kind: Lab
metadata:
  name: classroom-isolation
  title: Debian network isolation
spec:
  requirements:
    isolationClass: virtualMachine
    capabilities:
    - workload.vm.native
    - network.segment.isolated
  resources:
    networks:
    - name: classroom
      kind: isolated
      ipv4Cidr: 10.220.0.0/24
      ipam: static
      egress:
        mode: deny
    - name: separate
      kind: isolated
      ipv4Cidr: 10.221.0.0/24
      ipam: static
      egress:
        mode: deny
    vms:
    - name: alice
      imageRef: labcentral/classroom/debian@sha256:6e785923afe2d5ae5acde61e2cca818fb784f6f27a8f6bb22bc0b1eaac4b6cfa
      osFamily: linux
      compute:
        cpu: 1
        memory: 512Mi
        architecture: amd64
      interfaces:
      - networkRef: networks.classroom
        ipv4: 10.220.0.10
    - name: bob
      imageRef: labcentral/classroom/debian@sha256:6e785923afe2d5ae5acde61e2cca818fb784f6f27a8f6bb22bc0b1eaac4b6cfa
      osFamily: linux
      compute:
        cpu: 1
        memory: 512Mi
        architecture: amd64
      interfaces:
      - networkRef: networks.separate
        ipv4: 10.221.0.10
