# Requires a qualified target whose template catalogue contains this measured image.
# Browser VNC is discovered from the ready VM by the qualified access service.
# The digest identifies the 3 GiB logical disk, not the qcow2 container bytes.
apiVersion: labs.labcentral.io/v1alpha1
kind: Lab
metadata:
  name: debian-starter
  title: Debian starter
spec:
  requirements:
    isolationClass: virtualMachine
    capabilities: [workload.vm.native, network.segment.isolated]
  resources:
    networks:
      - name: classroom
        kind: isolated
        ipv4Cidr: 10.220.0.0/24
        ipam: static
        egress: {mode: deny}
    vms:
      - name: workstation
        imageRef: labcentral/classroom/debian@sha256:6e785923afe2d5ae5acde61e2cca818fb784f6f27a8f6bb22bc0b1eaac4b6cfa
        osFamily: linux
        compute: {cpu: 1, memory: 512Mi, architecture: amd64}
        interfaces: [{networkRef: networks.classroom, ipv4: 10.220.0.10}]
