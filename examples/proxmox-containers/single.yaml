apiVersion: labs.labcentral.io/v1alpha1
kind: Lab
metadata:
  name: container-python-web
spec:
  requirements:
    isolationClass: virtualMachine
    capabilities: [workload.container]
  resources:
    networks:
      - name: classroom
        kind: isolated
        ipv4Cidr: 10.220.0.0/24
        ipam: static
        egress: {mode: deny}
    containers:
      - name: web
        image: docker.io/library/python@sha256:46ee549c88617e9bc8acb843a326f1a5c0fa5608d7f9703509efe6d53b55f318
        isolation: virtualMachine
        realizationPreference: [viaVM]
        compute: {cpu: 1, memory: 512Mi, architecture: amd64}
        interfaces: [{networkRef: networks.classroom, ipv4: 10.220.0.10}]
        command: [python3]
        args: [-m, http.server, "8080"]
