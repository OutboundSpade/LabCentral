apiVersion: labs.labcentral.io/v1alpha1
kind: Lab
metadata:
  name: dockerfile-web
spec:
  requirements:
    isolationClass: virtualMachine
    capabilities:
    - workload.container
    - network.segment.isolated
  resources:
    containers:
    - name: web
      image: build://web
      isolation: virtualMachine
      realizationPreference:
      - viaVM
      compute:
        cpu: 1
        memory: 512Mi
        architecture: amd64
      command:
      - httpd
      args:
      - -f
      - -p
      - '8080'
      - -h
      - /www
      interfaces:
      - networkRef: networks.lab
        ipv4: 10.220.0.10
    networks:
    - name: lab
      kind: isolated
      ipv4Cidr: 10.220.0.0/24
      ipam: static
      egress:
        mode: deny
