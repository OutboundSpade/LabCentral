apiVersion: labs.labcentral.io/v1alpha1
kind: Lab
metadata:
  name: ansible-linux
spec:
  requirements:
    isolationClass: virtualMachine
    capabilities:
    - workload.vm.native
    - network.segment.isolated
  resources:
    vms:
    - name: workstation
      imageRef: build://workstation
      osFamily: linux
      compute:
        cpu: 1
        memory: 1Gi
        architecture: amd64
      interfaces:
      - networkRef: networks.lab
        ipv4: 10.220.0.10
    networks:
    - name: lab
      kind: isolated
      ipv4Cidr: 10.220.0.0/24
      ipam: static
      egress:
        mode: deny
