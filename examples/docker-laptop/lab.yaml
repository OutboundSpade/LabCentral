apiVersion: labs.labcentral.io/v1alpha1
kind: Lab
metadata:
  name: docker-sqlite-web
  title: Two-container SQLite web lab
spec:
  requirements:
    isolationClass: process
    capabilities:
      - workload.container.native
      - network.segment.isolated
      - network.portPublication.host
  resources:
    networks:
      - name: app
        kind: isolated
        ipam: providerManaged
        egress:
          mode: deny
    volumes:
      - name: data
        size: 1Gi
        persistence: persistent
        snapshot: false
    containers:
      - name: web
        image: docker.io/library/python@sha256:7415fbc3c9e4979cc717d92377ab2bc7b2b4a2af1ac03cc52b5f3f88efedaf3a
        compute: {cpu: 0.5, memory: 256Mi, architecture: amd64}
        isolation: process
        interfaces:
          - networkRef: networks.app
        mounts:
          - volumeRef: volumes.data
            path: /var/lib/lab
        environment:
          DATABASE_URL: sqlite:////var/lib/lab/lab.db
          PYTHONDONTWRITEBYTECODE: "1"
        command:
          - python
          - -c
          - |
            import http.server
            import json
            import sqlite3

            database = "/var/lib/lab/lab.db"

            class Handler(http.server.BaseHTTPRequestHandler):
                def do_GET(self):
                    connection = sqlite3.connect(database)
                    connection.execute("CREATE TABLE IF NOT EXISTS visits (id INTEGER PRIMARY KEY)")
                    connection.execute("INSERT INTO visits DEFAULT VALUES")
                    visits = connection.execute("SELECT COUNT(*) FROM visits").fetchone()[0]
                    connection.commit()
                    connection.close()
                    body = json.dumps({"service": "LabCentral Example A", "visits": visits}).encode()
                    self.send_response(200)
                    self.send_header("Content-Type", "application/json")
                    self.send_header("Content-Length", str(len(body)))
                    self.end_headers()
                    self.wfile.write(body)

            http.server.ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
        publishedPorts:
          - {name: web, port: 8080, protocol: tcp, exposure: host}
      - name: client
        image: docker.io/curlimages/curl@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
        compute: {cpu: 0.25, memory: 128Mi, architecture: amd64}
        isolation: process
        interfaces:
          - networkRef: networks.app
        command: ["sleep", "infinity"]
    accessEndpoints:
      - name: client-shell
        targetRef: containers.client
        methods: [containerExec]
  outputs:
    - name: web-url
      type: url
      value: resources.containers.web.publishedPorts.web.url
