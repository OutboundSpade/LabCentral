apiVersion: labs.labcentral.io/v1alpha1
kind: Lab
metadata:
  name: portable-observability
  title: Portable three-container service lab
spec:
  parameters:
    - {name: loadgen_ids, type: stringList, required: false, default: [one, two]}
  requirements:
    isolationClass: process
    capabilities:
      - workload.container
      - image.oci.pull
      - network.segment.l3
  resources:
    networks:
      - {name: service, kind: isolated, ipam: providerManaged, egress: {mode: deny}}
    containers:
      - name: api
        image: ghcr.io/labcentral/examples/api@sha256:3333333333333333333333333333333333333333333333333333333333333333
        compute: {cpu: 0.5, memory: 256Mi, architecture: amd64}
        isolation: process
        realizationPreference: [native, sandboxed, viaVM]
        interfaces: [{networkRef: networks.service}]
        environment: {LISTEN_ADDR: "[::]:8080"}
      - name: loadgen
        forEach: {key: id, in: params.loadgen_ids}
        image: ghcr.io/labcentral/examples/loadgen@sha256:4444444444444444444444444444444444444444444444444444444444444444
        compute: {cpu: 0.25, memory: 128Mi, architecture: amd64}
        isolation: process
        realizationPreference: [native, sandboxed, viaVM]
        interfaces: [{networkRef: networks.service}]
        environment: {TARGET_URL: "http://api.internal:8080"}
      - name: collector
        image: docker.io/otel/opentelemetry-collector@sha256:5555555555555555555555555555555555555555555555555555555555555555
        compute: {cpu: 0.25, memory: 256Mi, architecture: amd64}
        isolation: process
        realizationPreference: [native, sandboxed, viaVM]
        interfaces: [{networkRef: networks.service}]
    accessEndpoints:
      - {name: api-shell, targetRef: containers.api, methods: [containerExec, ssh]}
