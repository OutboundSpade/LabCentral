apiVersion: labs.labcentral.io/v1alpha1
kind: Lab
metadata:
  name: docker-http
  title: Container HTTP server
spec:
  requirements:
    isolationClass: process
    capabilities:
    - workload.container.native
    - network.segment.isolated
    - network.portPublication.host
  resources:
    networks:
    - name: app
      kind: isolated
      ipam: providerManaged
      egress:
        mode: deny
    containers:
    - name: web
      image: docker.io/library/python@sha256:7415fbc3c9e4979cc717d92377ab2bc7b2b4a2af1ac03cc52b5f3f88efedaf3a
      compute:
        cpu: 0.5
        memory: 256Mi
        architecture: amd64
      isolation: process
      interfaces:
      - networkRef: networks.app
      command:
      - python
      - -m
      - http.server
      - '8080'
      - --bind
      - 0.0.0.0
      publishedPorts:
      - name: web
        port: 8080
        protocol: tcp
        exposure: host
  outputs:
  - name: web-url
    type: url
    value: resources.containers.web.publishedPorts.web.url
