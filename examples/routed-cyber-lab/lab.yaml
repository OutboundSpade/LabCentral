apiVersion: labs.labcentral.io/v1alpha1
kind: Lab
metadata:
  name: routed-cyber-range
  title: Routed attacker and target range
spec:
  parameters:
    - {name: controlled_egress, type: boolean, required: false, default: false}
  requirements:
    isolationClass: virtualMachine
    capabilities:
      - workload.vm.native
      - network.segment.isolated
      - network.semantics.l2
      - network.interface.max>=3
      - lifecycle.snapshot.crashConsistent
  resources:
    networks:
      - {name: red, kind: isolated, ipv4Cidr: 10.10.10.0/24, ipam: static, egress: {mode: deny}}
      - {name: blue, kind: isolated, ipv4Cidr: 10.10.20.0/24, ipam: static, egress: {mode: deny}}
      - name: uplink
        kind: external
        ipam: providerManaged
        egress: {mode: restricted, destinations: ["tcp/80", "tcp/443", "udp/53"]}
        when: params.controlled_egress
    vms:
      - name: attacker
        imageRef: targetImage:kali-2026.2
        osFamily: linux
        compute: {cpu: 2, memory: 4Gi, architecture: amd64}
        interfaces: [{networkRef: networks.red, ipv4: 10.10.10.10}]
        provisioning: {method: cloudInit, artifactRef: bundle://guest/attacker-cloud-init.yaml}
        lifecycle: {snapshot: true, reset: snapshot}
      - name: router
        imageRef: targetImage:fedora-coreos-stable
        osFamily: linux
        compute: {cpu: 2, memory: 2Gi, architecture: amd64}
        interfaces:
          - {networkRef: networks.red, ipv4: 10.10.10.1}
          - {networkRef: networks.blue, ipv4: 10.10.20.1}
          - {networkRef: networks.uplink, when: params.controlled_egress}
        provisioning: {method: ignition, artifactRef: bundle://guest/router.ign}
        lifecycle: {snapshot: true, reset: snapshot}
      - name: target
        imageRef: targetImage:debian-12-vulnerable
        osFamily: linux
        compute: {cpu: 2, memory: 2Gi, architecture: amd64}
        interfaces: [{networkRef: networks.blue, ipv4: 10.10.20.10}]
        provisioning: {method: cloudInit, artifactRef: bundle://guest/target-cloud-init.yaml}
        lifecycle: {snapshot: true, reset: snapshot}
    accessEndpoints:
      - {name: attacker-console, targetRef: vms.attacker, methods: [ssh, vnc]}
  outputs:
    - {name: target-ip, type: ip, value: "resources.vms.target.interfaces[0].ipv4"}
