name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  GO_VERSION: 1.27.1

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Toolchain pin
        run: test "$(jq -r .go tools/toolchain.json)" = "$GO_VERSION"
      - run: go vet ./...
      - run: go test -race ./...

  release:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Hosted bundle
        env:
          TAG: ${{ github.ref_name }}
        run: ./tools/package-server.sh
      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          flags=(-trimpath -ldflags "-s -w -X github.com/OutboundSpade/LabCentral/v2/internal/cli.Version=$TAG")
          build() { CGO_ENABLED=0 GOOS=$1 GOARCH=$2 go build "${flags[@]}" -o "$3" "$4"; }
          mkdir -p dist/linux
          build linux amd64 dist/linux/labcentral ./cmd/labcentral
          build linux amd64 dist/linux/labcentral-provider ./cmd/labcentral-provider
          cp LICENSE tools/toolchain.json dist/linux/
          tar -C dist/linux --owner=0 --group=0 -czf dist/labcentral-linux-amd64.tar.gz .
          build windows amd64 dist/labcentral-windows-amd64.exe ./cmd/labcentral
          build darwin arm64 dist/labcentral-darwin-arm64 ./cmd/labcentral
          build darwin amd64 dist/labcentral-darwin-amd64 ./cmd/labcentral
          test "$(dist/linux/labcentral version)" = "labcentral $TAG"
          cd dist
          sha256sum labcentral-server-linux-amd64.tar.gz labcentral-linux-amd64.tar.gz labcentral-windows-amd64.exe \
            labcentral-darwin-arm64 labcentral-darwin-amd64 > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --title "LabCentral $TAG" --generate-notes \
            --notes-file .github/release-notes.md \
            dist/labcentral-server-linux-amd64.tar.gz dist/labcentral-linux-amd64.tar.gz dist/labcentral-windows-amd64.exe \
            dist/labcentral-darwin-arm64 dist/labcentral-darwin-amd64 dist/SHA256SUMS
