name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.27.1

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Toolchain pin
        run: test "$(jq -r .go tools/toolchain.json)" = "$GO_VERSION"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Native failure matrix
        run: go test -race -tags faultinject ./...
      - run: go test ./...
        working-directory: examples/consumer
      - name: Generated files are current
        run: |
          go run ./tools/schema
          go run ./tools/webapi
          git diff --exit-code -- schemas web/src/lib/types.ts
      - name: Examples validate
        run: |
          go build -o /tmp/labcentral ./cmd/labcentral
          for lab in examples/*/lab.yaml; do /tmp/labcentral validate "$(dirname "$lab")"; done
          /tmp/labcentral validate --template examples/starter-template
      - name: Cross-compile the CLI
        run: |
          for target in windows/amd64 darwin/arm64; do
            CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/labcentral
          done

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run check
      - run: npm --prefix web run build
